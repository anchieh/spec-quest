<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Spec Quest · Pick Just Enough</title>
<meta name="description" content="A browser game about choosing industrial PC specs: just enough wins.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;600;700;900&display=swap">
<style>
:root{--bg:#050910;--ink:#f1f3f6;--mute:#939ca9;--line:#2a374b;--gold:#ffc65a;--red:#ff4f45;--teal:#3f7fe0;--amber:#ffa53a;--green:#45d18a;--blue:#5aa2ea;
 --game:"Chakra Petch","Noto Sans TC","Segoe UI",sans-serif;--tc:"Noto Sans TC","Microsoft JhengHei","PingFang TC","Segoe UI",sans-serif;--mono:"IBM Plex Mono",Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none}
html,body{margin:0;min-height:100%;background:var(--bg);overscroll-behavior:none}
body{font-family:var(--tc);color:var(--ink);overflow-x:hidden;
 background:radial-gradient(1100px 620px at 50% 30%,#122138 0%,transparent 70%),linear-gradient(180deg,#050910,#080f1a 60%,#060a10);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.4;background-image:linear-gradient(rgba(255,170,80,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,170,80,.07) 1px,transparent 1px);background-size:40px 40px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#bPagePrev:focus-visible,#bPageNext:focus-visible{outline:none}
.screen{display:none;position:relative;min-height:100vh}.screen.on{display:block}
/* ---------- 強制橫向 ---------- */
.rotateLock{display:none;position:fixed;inset:0;z-index:999;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);text-align:center;padding:30px}
.rotateLock .rl-ic{width:58px;height:92px;border:4px solid var(--gold);border-radius:12px;position:relative;animation:rlSpin 1.8s ease-in-out infinite}
.rotateLock .rl-ic::after{content:"";position:absolute;left:50%;bottom:9px;width:7px;height:7px;border-radius:50%;background:var(--gold);transform:translate(-50%,0)}
@keyframes rlSpin{0%,15%{transform:rotate(0)}45%,100%{transform:rotate(90deg)}}
.rotateLock .rl-t{font:700 19px var(--tc);color:var(--ink);max-width:320px}
.rotateLock .rl-t2{font:14px var(--tc);color:var(--mute)}
@media (orientation:portrait) and (max-width:900px){
 .rotateLock{display:flex}
 body>.screen{display:none!important}
}
.wrap{max-width:1600px;margin:0 auto;padding:14px 20px 24px}
.pn{border-radius:16px;background:linear-gradient(180deg,rgba(16,25,38,.92),rgba(7,12,20,.92));border:1px solid var(--line);box-shadow:0 20px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05)}
.k{font:700 14px var(--game);letter-spacing:1.5px;color:var(--gold);text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 26px;border-radius:14px;font:900 18px var(--tc);letter-spacing:2px;color:#2a1600;
 background:linear-gradient(180deg,#ffe29a,#ffc65a 50%,#d1840f);box-shadow:0 6px 0 #7a4a0a,0 12px 24px rgba(255,198,90,.3),inset 0 2px 0 rgba(255,255,255,.55);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #7a4a0a}
.btn.ghost{color:var(--ink);background:linear-gradient(180deg,#1d2f4a,#0f1a2a);box-shadow:0 5px 0 #060c14,inset 0 1px 0 rgba(255,255,255,.1);border:1px solid #3a4d6a}
.btn[disabled]{filter:grayscale(1) brightness(.45);opacity:.7;cursor:not-allowed;box-shadow:none}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#0f1a2a;border:1px solid #2f3e55;font:700 15px var(--game)}
#bgmLoad{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--teal),var(--gold));z-index:60;transition:width .25s linear,opacity .2s;opacity:0;pointer-events:none}
#bgmLoad.on{opacity:1}
svg.ic{display:block}
.coin{display:inline-block;width:20px;height:20px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff3c4,#ffc54a 45%,#b8700c);box-shadow:inset 0 -2px 0 rgba(0,0,0,.3)}
.star{width:22px;height:22px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:#212d40;display:inline-block}
.star.on{background:linear-gradient(180deg,#ffe08a,#ffad1f)}
/* ---------- 標題 ---------- */
#title .hero{min-height:100vh;display:grid;place-items:center;text-align:center;padding:30px 20px;cursor:pointer}
.logo{font:700 clamp(48px,8.5vw,108px)/1 var(--game);letter-spacing:4px;background:linear-gradient(180deg,#fff6d2,#ffc65a 55%,#d1840f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 #3a2208) drop-shadow(0 0 30px rgba(255,198,90,.35))}
.logo2{font:900 clamp(28px,4vw,46px) var(--tc);letter-spacing:3px;margin-top:10px;text-shadow:0 3px 0 #000;animation:tapPulse 1.8s ease-in-out infinite}
.tag{max-width:920px;margin:24px auto 32px;font:19px/1.7 var(--tc);color:#c1c8d2;white-space:pre-line}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0 28px}
.chip{display:flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;background:#0e1724;border:1px solid #2f3e55;font:700 17px var(--tc)}
.tbar{position:absolute;top:14px;right:172px;display:flex;gap:8px;z-index:5}
.liLink{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:5;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:12px;text-decoration:none;transition:opacity .15s}
.liLink:hover{opacity:.85}
.liLink .liText{font:700 15px var(--tc);color:var(--ink);letter-spacing:.5px}
.liLink .liIc{width:80px;height:80px;border-radius:18px;background:#0a66c2;color:#fff;display:grid;place-items:center;font:900 32px var(--game);flex:none;box-shadow:0 6px 16px rgba(0,0,0,.4),0 0 0 0 rgba(10,102,194,.45);animation:liPulse 2.8s ease-in-out infinite}
@keyframes liPulse{0%,100%{box-shadow:0 6px 16px rgba(0,0,0,.4),0 0 0 0 rgba(10,102,194,.45)}50%{box-shadow:0 6px 16px rgba(0,0,0,.4),0 0 0 9px rgba(10,102,194,0)}}
.heroboard{position:relative;height:180px;margin:-10px auto 8px;width:360px;perspective:900px}
.hb{position:absolute;left:50%;top:50%;width:276px;height:180px;margin:-90px 0 0 -138px;border-radius:10px;transform-style:preserve-3d;background:radial-gradient(circle at 30% 25%,#1f437a,#0d254a 60%,#081a35);box-shadow:0 30px 50px rgba(0,0,0,.7),0 0 40px rgba(63,127,224,.3);animation:spin 14s linear infinite}
@keyframes spin{from{transform:rotateX(58deg) rotateZ(0)}to{transform:rotateX(58deg) rotateZ(360deg)}}
.hb .trace{position:absolute;inset:0;opacity:.35;border-radius:10px;background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(150,182,230,.35) 22px 24px),repeating-linear-gradient(0deg,transparent 0 30px,rgba(150,182,230,.25) 30px 32px)}
.howto{margin-top:16px;padding:18px 20px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.howto .st{display:flex;gap:12px;align-items:flex-start}.howto .n{flex:none;width:34px;height:38px;display:grid;place-items:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--gold);color:#2a1600;font:700 17px var(--game)}
.howto b{display:block;font:700 16px var(--tc);margin-bottom:3px}.howto span{font:14px/1.55 var(--tc);color:#c1c8d2}
@media (max-width:1180px){.howto{grid-template-columns:1fr 1fr}}@media (max-width:720px) and (orientation:portrait){.howto{grid-template-columns:1fr}}
@keyframes tapPulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes mviewFlash{0%,100%{background:#0f1a2a;border-color:#2f3e55;box-shadow:none;color:var(--ink)}50%{background:var(--gold);border-color:var(--gold);box-shadow:0 0 16px 2px rgba(255,198,90,.85);color:#2a1600}}
/* ---------- 地圖 ---------- */
.trophyRow{padding:14px 16px;margin-bottom:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tropSlots{display:flex;gap:6px;flex-wrap:wrap}
.tslot{display:flex;align-items:center;justify-content:center;flex:none;color:var(--mute);opacity:.6}
.tslot.done{opacity:1;color:var(--gold)}
.tslot.done svg{filter:drop-shadow(0 0 4px rgba(255,198,90,.5))}
.trophyRow #bClaim{margin-left:auto}
@media (max-width:720px) and (orientation:portrait){.trophyRow{flex-direction:column;align-items:stretch}.trophyRow #bClaim{margin-left:0;width:100%}}
/* ---------- 證書 ---------- */
.certWrap,.certFinal{display:flex;flex-direction:column;gap:16px}
.certPreview{border-radius:14px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.5)}
.certPreview svg{width:100%;height:auto;display:block}
@keyframes certShine{0%{filter:brightness(1) saturate(1);transform:scale(1)}40%{filter:brightness(1.7) saturate(1.5);transform:scale(1.03)}100%{filter:brightness(1) saturate(1);transform:scale(1)}}
.certPreview.certAnim{animation:certShine .9s ease}
.certForm{display:flex;flex-direction:column;gap:10px}
.certForm input{height:48px;padding:0 16px;border-radius:12px;background:#0b121d;border:1.5px solid #2f3e55;color:var(--ink);font:700 18px var(--tc)}
.certForm input:focus{outline:2px solid var(--gold)}
.certForm .row,.certFinal .row{display:flex;gap:10px;justify-content:flex-end}
.mhd{display:flex;align-items:center;flex-wrap:wrap;gap:14px;margin:6px 0 16px}
.mhd h2{margin:0;min-width:0;font:900 56px var(--tc);letter-spacing:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mhd .tot{margin-left:auto;display:flex;align-items:center;gap:8px;font:700 18px var(--game);flex:none}
.zones{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.zone{padding:16px;border-radius:18px;position:relative;overflow:hidden}
.zone h3{margin:0 0 4px;font:900 22px/1.25 var(--tc);display:flex;align-items:center;gap:8px}.zone h3 span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.zone .zs{font:14px/1.4 var(--tc);color:var(--mute);margin-bottom:12px;min-height:2.8em}
.zone::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:var(--zc);opacity:.12}
.lvl{width:100%;display:flex;align-items:center;gap:10px;padding:12px;margin-bottom:10px;border-radius:14px;text-align:left;background:#0b121d;border:1.5px solid #243144;transition:transform .12s,border-color .12s;position:relative;overflow:hidden}
.lvl:hover:not([disabled]){transform:translateY(-2px);border-color:var(--zc)}
.lvl::before{content:"";position:absolute;inset:0;background:var(--zc);z-index:-2}
.lvl::after{content:"";position:absolute;inset:0;background:inherit;clip-path:polygon(34px 0,100% 0,100% 100%,0 100%,0 34px);z-index:-1}
.lvl .no{position:absolute;left:9px;top:7px;font:700 16px var(--game);font-style:normal;color:#030a14;line-height:1}
.lvl .no svg{display:block}
.lvlL{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px}
.lvlN{min-width:0}
.lvl b{display:block;font:600 22px/1.25 var(--tc)}.lvl small{display:flex;gap:3px;margin-top:4px}.lvl small .star{width:15px;height:15px}
html[lang="zh-Hant"] .lvl b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[lang="en"] .lvl b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lvl[disabled]{opacity:.45;cursor:not-allowed}.lvl.boss{border-color:#7a3a2c;background:linear-gradient(90deg,#2a1210,#0b121d)}
/* ---------- 遊戲 ---------- */
.hud{position:relative;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.hex{width:56px;height:62px;flex:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,#fff0b0,#e08a18 60%,#8a4d06);display:grid;place-items:center}
.hex .in{width:47px;height:53px;clip-path:inherit;background:radial-gradient(circle at 50% 35%,#1d293a,#070c14);display:grid;place-items:center}
.ttl{min-width:0}.ttl small{display:block;font:700 13px var(--game);letter-spacing:3px;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ttl b{display:block;font:900 52px/1.05 var(--tc);letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:5px}.dots i{width:24px;height:7px;border-radius:4px;background:#1d293a;transform:skewX(-20deg)}.dots i.d{background:var(--green)}.dots i.c{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.mviewBtn{display:none}
.modalBack{position:fixed;left:16px;top:16px;z-index:45}
.globalBar{position:fixed;right:16px;top:16px;z-index:45;display:flex;gap:8px}
.mhd,.hud{padding-right:184px;padding-left:84px}
.hud .sp{flex:1}
.costpill{display:flex;align-items:center;gap:10px;height:46px;padding:0 16px 0 10px;border-radius:12px;background:linear-gradient(180deg,#182436,#0a111c);border:1px solid #2f3e55}
.costpill b{font:700 24px var(--game);font-variant-numeric:tabular-nums}.costpill small{font:600 13px var(--tc);color:var(--mute)}
#play{height:100vh;overflow:hidden}
#play .wrap{height:100%;display:flex;flex-direction:column;overflow:hidden}
.topRow{display:grid;gap:14px;grid-template-columns:1.1fr 1fr .8fr;grid-template-rows:380px;margin-bottom:14px;flex:0 0 auto}
.stage3d,.scn,.shipbox{min-height:0;overflow-y:auto}
.scn{padding:16px}.tierPage{padding:14px;height:100%;overflow-y:auto;display:flex;flex-direction:column}
.tierPage .tr{display:flex;flex-direction:column}
.ffbox{padding:14px}.shipbox{position:relative;padding:14px;display:flex;flex-direction:column;gap:10px}
.pager{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
.pagerHd{display:flex;align-items:center;justify-content:center;gap:16px;flex:0 0 auto}
.pslots{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.pslot{flex:1;min-width:0;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:3px 4px;border-radius:9px;background:#0a1019;border:1.5px solid #212d40;color:#4c5563;cursor:pointer;transition:all .12s;overflow:hidden}
.pslot.vis-only{justify-content:stretch;padding:0}
.pslot.vis-only .pslotVis{flex:1}
.pslot:hover{border-color:#3f577a}
.pslotVis{flex:1;width:100%;min-height:0;position:relative;overflow:hidden}
.pslotVis.ic{display:flex;align-items:center;justify-content:center}
.pslotVis svg{opacity:.55}
.pslot b{display:block;max-width:100%;flex:none;font:700 13px var(--tc);color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pslot.done{background:linear-gradient(180deg,#12223a,#0a121f);border-color:#2f476a;color:var(--ink)}
.pslot.done .pslotVis svg{opacity:1}
#pageSlots .pslotVis .h b{font-size:11px}
#pageSlots .pslotVis .bd{border:none;padding:0;font-size:8px;white-space:nowrap}
#pageSlots .pslotVis .bd br{display:none}
.pslot.cur{border-color:var(--teal);box-shadow:0 0 0 2px rgba(63,127,224,.5)}
.pages{position:relative;flex:1;min-height:0}
.page{display:none;height:100%;overflow-y:auto}
.page.on{display:block}
.scn .top{display:flex;gap:12px;align-items:center}.scn .top>div{min-width:0}.scn .ic{width:60px;height:60px;flex:none;border-radius:14px;display:grid;place-items:center;background:radial-gradient(circle,#2b3e5a,#0b1422);border:2px solid var(--gold)}
/* 步驟序號 */
.stepno{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:7px;background:linear-gradient(180deg,#1f3f6e,#0f203a);border:1px solid var(--teal);color:var(--ink);font:700 13px var(--tc);flex:0 0 auto;box-shadow:0 0 10px rgba(63,127,224,.35)}
.stepk{display:flex;align-items:center;gap:8px;margin-bottom:8px;font:700 13px var(--tc);letter-spacing:.5px;color:var(--teal);text-transform:uppercase}
.ffbox .hd .stepno,.tiers .hd .stepno{margin-right:2px}
.shelf .shelfhd{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin:2px 0 2px}.shelf .shelfhd b{font:900 26px var(--tc);letter-spacing:.5px}
.shipbox .stepk{margin-bottom:-2px}
/* 選板型前，規格與擴充先弱化，引導視線 */
.pn.needBoard{position:relative;opacity:.4;pointer-events:none;filter:saturate(.4)}
.pn.needBoard::after{content:attr(data-hint);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;font:700 14px/1.5 var(--tc);color:var(--gold);background:rgba(6,9,14,.6);border-radius:16px;opacity:1}
.scn h2{margin:2px 0 0;font:900 22px/1.2 var(--tc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.briefHd{display:flex;gap:16px;align-items:flex-start;margin-top:8px}
.briefHdText{flex:1;min-width:0}
.briefHdText h2{margin:2px 0 6px}
.story{font:14.5px/1.65 var(--tc);color:#c1c8d2;margin:10px 0}
.clueGrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px}
.clue{display:flex;gap:8px;align-items:flex-start;font:14px/1.4 var(--tc);color:#d8dde5;margin:3px 0}.clue i{flex:none;width:8px;height:8px;margin-top:5px;transform:rotate(45deg);background:var(--gold)}
.briefCtx .story{font-size:16px}
.briefCtx.sec{opacity:.78}.briefCtx.sec .story{margin:8px 0 4px}.briefCtx.sec .clue{color:var(--mute)}.briefCtx.sec .clue i{width:6px;height:6px;margin-top:5px}
.mechk{font:700 14px var(--game);letter-spacing:1.5px;color:var(--gold);text-transform:uppercase;margin:16px 0 6px}
.reqGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:5px}
.req{padding:5px 10px;border-radius:10px;background:#0a1019;border:1px solid #212d40;font:700 14px var(--tc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctxk{font:700 13px var(--tc);letter-spacing:.5px;color:var(--mute);text-transform:uppercase;margin-bottom:8px}
.sect{font:700 14px var(--game);letter-spacing:1.2px;color:var(--mute);margin:14px 0 4px}
/* 3D 場景 */
.stage3d{position:relative;overflow:hidden;border-radius:16px}
.scene{position:absolute;left:50%;top:50%;transform-style:preserve-3d}
.enc{position:absolute;border:3px dashed rgba(255,198,90,.85);border-radius:10px;background:rgba(255,198,90,.03);box-shadow:0 0 30px rgba(255,198,90,.2)}
.enc.bad{border-color:rgba(255,79,69,.9);box-shadow:0 0 40px rgba(255,79,69,.4)}
.enc span{position:absolute;left:8px;bottom:-30px;font:700 15px var(--tc);color:var(--gold);white-space:nowrap}
.pcb{position:absolute;border-radius:8px;transform-style:preserve-3d;background:radial-gradient(circle at 30% 25%,#1f437a,#0d254a 60%,#081a35);box-shadow:0 0 0 2px #0a182e,0 40px 60px rgba(0,0,0,.8),0 0 40px rgba(63,127,224,.2);transition:all .35s}
.pcb.come{background:radial-gradient(circle at 30% 25%,#2a5f8c,#173a5a 60%,#0e2840)}
.pcb .trace{position:absolute;inset:0;opacity:.35;background:repeating-linear-gradient(90deg,transparent 0 24px,rgba(150,182,230,.35) 24px 26px),repeating-linear-gradient(0deg,transparent 0 38px,rgba(150,182,230,.25) 38px 40px);-webkit-mask-image:radial-gradient(circle at 60% 60%,#000 30%,transparent 80%)}
.hole{position:absolute;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle,#050910 40%,#e8c06a 45%,#a8771f 70%)}
.silk{position:absolute;left:12px;bottom:8px;font:600 11px var(--mono);letter-spacing:2px;color:rgba(232,235,239,.75);white-space:nowrap}
.cpu{position:absolute;border-radius:5px;background:#2a2f33;transform:translateZ(5px)}
.fins{position:absolute;inset:-5px;border-radius:5px;transform:translateZ(18px);background:repeating-linear-gradient(90deg,#c9d3db 0 4px,#7d8a95 4px 8px);box-shadow:0 10px 18px rgba(0,0,0,.6)}
.dimm{position:absolute;width:9px;border-radius:2px;background:linear-gradient(90deg,#1b1b1b,#333);transform:translateZ(6px)}
.slot{position:absolute;height:10px;border-radius:2px;background:#151515;box-shadow:0 0 0 1px #000}
.slot.x16{background:#1a1a2a}
.m2s{position:absolute;width:56px;height:16px;border-radius:2px;background:rgba(0,0,0,.35);border:1px dashed rgba(255,255,255,.35)}
.m2s.used{background:linear-gradient(90deg,#2f6fb5,#5aa2ea);border:0;box-shadow:0 0 14px rgba(90,162,234,.8);transform:translateZ(3px)}
.m2s b{position:absolute;inset:0;display:grid;place-items:center;font:600 10px var(--mono);color:#fff}
.stand{position:absolute;height:0;transform-style:preserve-3d}
.stand .face{position:absolute;left:0;top:0;transform-origin:top;border-radius:5px 5px 0 0;display:flex;flex-direction:column;justify-content:center;padding:0 8px;font:900 13px var(--tc);color:#030a14;box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)}
.stand.mine .face{background:linear-gradient(180deg,#307ef2,#134591);box-shadow:0 0 30px rgba(63,127,224,.7),inset 0 0 0 2px rgba(255,255,255,.4)}
.stand.cust .face{background:linear-gradient(180deg,#c9d3db,#7d8a95);color:#0b121d}
.stand.gpu .face{background:linear-gradient(180deg,#b78cff,#6a3fc4);color:#fff;box-shadow:0 0 26px rgba(183,140,255,.6),inset 0 0 0 2px rgba(255,255,255,.35)}
.rear{position:absolute;left:0;top:-3px;height:0;transform-style:preserve-3d}
.port{position:absolute;top:0;height:24px;transform-origin:top;transform:rotateX(-90deg);border-radius:3px;background:linear-gradient(180deg,#a9b4bd,#6f7b84);display:grid;place-items:center}
.port i{display:block;border-radius:2px}
.port.db{width:34px}.port.db i{width:22px;height:9px;background:#1f3d8a;clip-path:polygon(0 0,100% 0,88% 100%,12% 100%)}
.port.lan{width:26px}.port.lan i{width:14px;height:11px;background:#111}
.dng{position:absolute;top:-34px;width:18px;height:26px;border-radius:4px;background:linear-gradient(180deg,#ff7a6b,#b52a20);box-shadow:0 0 14px rgba(255,79,69,.8);transform:rotateX(-90deg) translateY(-20px);transform-origin:top}
.sceneinfo{position:absolute;left:14px;top:12px;display:flex;flex-wrap:wrap;gap:6px;z-index:2}
.sceneinfo span{font:700 13px var(--tc);padding:4px 10px;border-radius:8px;background:rgba(6,9,14,.85);border:1px solid #3a485e}
.sceneinfo span.lv{border-color:var(--teal);color:var(--teal)}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;font:700 17px var(--tc);color:var(--mute)}
/* 擴充：和選板型一樣的方形牌卡 */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:10px;align-content:start;height:100%;overflow-y:auto}
.adCell{display:flex;flex-direction:column;min-width:0}
.ad{position:relative;display:flex;flex-direction:column;aspect-ratio:1;overflow:hidden;padding:6px 7px;border-radius:12px;background:linear-gradient(180deg,#0f1724,#080e16);border:1.5px solid #243144;min-width:0;cursor:pointer;transition:all .12s;text-align:left}
.ad:hover:not(.lock){border-color:#3f577a;transform:translateY(-2px)}
.ad.sel{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal),0 0 24px rgba(63,127,224,.4);background:linear-gradient(180deg,#142640,#0a121d)}
.ad.trap{border-color:rgba(255,79,69,.45)}.ad.lock{opacity:.4;cursor:not-allowed}
.ad .h{display:flex;align-items:center;gap:5px;min-height:36px}.ad .h b{font:700 14px/1.25 var(--tc)}
.ad .box{position:relative;flex:1;min-width:0;height:30px;margin:0;display:grid;place-items:center;border-radius:8px;background:#060b12}
.ad .cnt{position:absolute;bottom:1px;left:50%;transform:translateX(-50%);flex:none;min-width:14px;text-align:center;font:700 10px var(--tc);line-height:13px;color:var(--ink);background:#16243a;border:1px solid var(--teal);padding:0 4px;border-radius:5px}
.ad .ctRow{display:flex;align-items:center;gap:4px;margin:4px 0 4px}
.ad .ctRow button{flex:none;width:26px;height:30px;border-radius:8px;background:#16243a;border:1px solid #2f3e55;font:700 15px var(--game);line-height:1;color:var(--ink)}
.ad .ctRow button:disabled{opacity:.3;cursor:not-allowed}
.adCell .nm{margin-top:1px}
.adCell .nm small{display:block;font:600 12px var(--mono);color:var(--mute)}
.adCell .why{margin-top:2px;font:600 12px/1.35 var(--tc);color:#c8ced6;white-space:normal}
/* 分級 */
.tiers .hd,.ffbox .hd{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}.tiers .hd b,.ffbox .hd b{font:900 34px var(--tc);letter-spacing:1px}.tiers .hd span,.ffbox .hd span{font:13px var(--tc);color:var(--mute)}
.tr{margin-bottom:6px;padding:5px 10px 6px;border-radius:12px;background:#0a1019;border:1px solid #212d40}
.tn{display:flex;align-items:center;gap:8px;margin-bottom:2px;height:24px}.tn span{font:700 15px var(--tc)}.tn small{margin-left:auto;font:700 12px var(--tc);color:var(--mute)}
.tg{display:grid;gap:10px}
.tc{display:flex;flex-direction:column;aspect-ratio:1;overflow:hidden;padding:6px 7px;border-radius:8px;background:#070d15;border:1.5px solid #1f2a3a;text-align:left;transition:all .12s}
.tc .h{display:flex;align-items:center;gap:4px;min-height:36px}.tc .h b{font:700 14px/1.25 var(--tc);white-space:normal;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.tc .box{height:42px;margin:4px 0}
.tc:hover:not(:disabled){border-color:#3f577a}
.tc.on{background:linear-gradient(180deg,#1f3f6e,#0f203a);border-color:var(--teal);box-shadow:0 0 14px rgba(63,127,224,.4)}
.tr.locked{opacity:.75;flex:1;justify-content:center;gap:12px}.tr.locked .tc{cursor:not-allowed}.tr.locked .tc:not(.on){opacity:.35}
.lockb{display:inline-flex;align-items:center;gap:4px;font:700 12px var(--tc);color:var(--gold)}
.trWhy{font:13px/1.5 var(--tc);color:var(--mute)}.trWhy b{color:#c8ced6;font-weight:700}
/* 板型 */
.ffr{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:start}
.ffCell{display:flex;flex-direction:column;min-width:0}
.ff{position:relative;min-width:0;aspect-ratio:1;overflow:hidden;display:flex;flex-direction:column;border-radius:12px;padding:6px 7px;background:linear-gradient(180deg,#0f1724,#080e16);border:1.5px solid #243144;text-align:left;transition:all .12s}
.ff:hover:not(.lock){border-color:#3f577a;transform:translateY(-2px)}
.ff.sel{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal),0 0 24px rgba(63,127,224,.4);background:linear-gradient(180deg,#142640,#0a121d)}
.ff.lock{opacity:.4;cursor:not-allowed}
.ff .h{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:38px;flex:none}.ff .h b{display:block;width:100%;white-space:nowrap;font:700 14px/1.2 var(--tc)}
.bd{margin-left:auto;min-width:0;font:700 12px var(--tc);padding:1px 6px;border-radius:5px;text-align:right}
.bd.dim{border:1px solid var(--line);color:var(--mute);font:600 12px var(--mono)}.bd.lk{border:1px solid var(--gold);color:var(--gold)}
.box{position:relative;height:30px;margin:4px 0 4px;display:grid;place-items:center;border-radius:8px;background:#060b12;overflow:hidden}
.ff .box{align-items:end;justify-items:center;padding-bottom:1px}
.lim{position:absolute;border:2px dashed rgba(255,198,90,.75);border-radius:4px}
.sil{position:relative;border-radius:3px;background:linear-gradient(135deg,#2a579a,#0e264a);box-shadow:0 0 0 1px #4f83d1}
.spec{display:flex;flex-wrap:wrap;gap:3px;font:700 12.5px var(--game);color:#c8ced6}.spec span{padding:1px 4px;border-radius:5px;background:#0a111c}
.prRow{display:flex;align-items:center;justify-content:flex-start;gap:3px;margin-top:auto;padding-top:3px;font:700 13px var(--game);color:#c8ced6;flex:none}
.prRow .coin{width:11px;height:11px}
.var{display:flex;gap:3px;margin-top:3px}.var button{flex:1;height:28px;padding:0 4px;border-radius:6px;font:700 13px var(--tc);background:#0a111c;border:1px solid #212d40;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.specOut{display:flex;flex-direction:column;gap:2px;margin-top:4px;font:700 12.5px var(--game);color:#c8ced6}.specOut span{padding:1px 2px;border-radius:4px}
.specOut span.flash{animation:specFlash .9s ease-out}
@keyframes specFlash{0%{color:var(--gold);background:rgba(255,198,90,.25);text-shadow:0 0 8px rgba(255,198,90,.7)}100%{color:#c8ced6;background:transparent;text-shadow:none}}
.lockOut{margin-top:3px;display:flex;align-items:center;justify-content:center;gap:4px;padding:3px 0;border-radius:6px;border:1px solid var(--gold);color:var(--gold);font:700 12px var(--tc);text-align:center}
.var button.on{background:#1f3f6e;border-color:var(--teal);color:var(--ink)}
/* 出貨 */
.cost{display:flex;align-items:baseline;gap:10px}.cost b{font:700 34px var(--game);font-variant-numeric:tabular-nums}.cost small{font:14px var(--tc);color:var(--mute)}
.costBreak{font:600 13px var(--mono);color:var(--mute);margin-top:-4px}
.shipTimer{position:absolute;top:64px;right:14px;font:700 28px var(--game);color:var(--gold);text-align:right;letter-spacing:2px;font-variant-numeric:tabular-nums}
#shipTimer2{display:none}
.shipTimer.low{color:var(--red);animation:tpulse .5s steps(1) infinite}
@keyframes tpulse{0%,49%{opacity:1}50%,100%{opacity:.1}}
.shipTimer.tick:not(.low){animation:timerTick .3s ease-out}
@keyframes timerTick{0%{opacity:.35;transform:scale(1.18)}100%{opacity:1;transform:scale(1)}}

/* 倒數壓力特效：十種故障情境的畫面提示，疊在 #play 畫面上方 */
#riskFx{position:fixed;inset:0;pointer-events:none;z-index:42;overflow:hidden}
.ov{position:absolute;inset:0;opacity:0}
.ov-temp{position:absolute;inset:0;transform-origin:100% 0%}
.ov-temp .heat{position:absolute;inset:0;background:radial-gradient(80% 100% at 100% 0%,rgba(255,245,220,.55) 0%,rgba(255,190,100,.5) 32%,rgba(255,150,65,.35) 60%,rgba(255,120,40,.15) 82%,rgba(255,120,40,0) 100%)}
.ov-temp.on{animation:tempGrow 2s linear forwards}
@keyframes tempGrow{0%{opacity:0;transform:scale(.03)}30%{opacity:.08;transform:scale(.4)}55%{opacity:.25;transform:scale(.68)}100%{opacity:.85;transform:scale(1.35)}}
.ov-power{background:radial-gradient(140% 120% at 50% 50%,rgba(220,236,255,.9),rgba(150,190,255,.35) 55%,transparent 80%)}
.ov-power.on{animation:fxFlicker 2s steps(1,end) forwards}
@keyframes fxFlicker{0%{opacity:0}4%{opacity:.9}9%{opacity:.1}14%{opacity:.8}20%{opacity:.05}30%{opacity:.7}36%{opacity:.1}44%{opacity:.75}50%{opacity:.08}58%{opacity:.85}62%{opacity:.15}68%{opacity:.9}71%{opacity:.1}76%{opacity:.95}78%{opacity:.15}82%{opacity:1}84%{opacity:.2}87%{opacity:1}89%{opacity:.25}92%{opacity:1}94%{opacity:.3}96%{opacity:1}98%{opacity:.4}100%{opacity:.9}}
.ov-prot svg{width:100%;height:100%}
.ov-prot path{fill:none;stroke:#bfe0ff;stroke-width:2;filter:drop-shadow(0 0 6px rgba(150,210,255,.9));stroke-dasharray:420;stroke-dashoffset:420}
.ov-prot.on{animation:fxProtFlash 2s steps(1,end) forwards}
.ov-prot.on path{animation:fxDrawCrack 2s steps(1,end) forwards}
@keyframes fxDrawCrack{0%{stroke-dashoffset:420}6%{stroke-dashoffset:40}100%{stroke-dashoffset:40}}
@keyframes fxProtFlash{0%{opacity:0}3%{opacity:1}8%{opacity:.12}27%{opacity:.12}30%{opacity:1}34%{opacity:.12}37%{opacity:1}41%{opacity:.12}44%{opacity:1}48%{opacity:.25}100%{opacity:.25}}
.ov-protusb{background:radial-gradient(circle at 88% 85%,rgba(255,255,255,.95) 0%,rgba(190,225,255,.7) 10%,transparent 24%)}
.ov-protusb.on{animation:fxSpark 2s steps(1,end) forwards}
@keyframes fxSpark{0%,100%{opacity:0}6%{opacity:1}10%{opacity:0}30%{opacity:1}33%{opacity:0}50%{opacity:1}53%{opacity:0}64%{opacity:1}67%{opacity:0}76%{opacity:1}78%{opacity:0}85%{opacity:1}87%{opacity:0}92%{opacity:1}94%{opacity:0}97%{opacity:1}99%{opacity:0}}
.ov-store{background-image:repeating-linear-gradient(0deg,rgba(90,255,160,.5) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(90,255,160,.35) 0 1px,transparent 1px 4px);background-size:100% 6px,6px 100%;mix-blend-mode:screen;clip-path:inset(100% 0 0 0)}
.ov-store.on{animation:fxRiseNoise 2s ease-in forwards,fxFlickerNoise .12s steps(1,end) infinite}
@keyframes fxRiseNoise{0%{opacity:0;clip-path:inset(100% 0 0 0)}20%{opacity:.9}100%{opacity:.9;clip-path:inset(0% 0 0 0)}}
@keyframes fxFlickerNoise{0%{filter:brightness(1)}50%{filter:brightness(1.6)}100%{filter:brightness(1)}}
.ov-supply{backdrop-filter:grayscale(0) brightness(1);clip-path:inset(0 100% 0 0)}
.ov-supply.on{animation:fxSupplyWipe 2s linear forwards}
@keyframes fxSupplyWipe{0%{clip-path:inset(0 100% 0 0);backdrop-filter:grayscale(1) brightness(.78)}100%{clip-path:inset(0 0 0 0);backdrop-filter:grayscale(1) brightness(.78)}}
.ov-cert.on{opacity:1}
.ov-cert .strip{position:absolute;opacity:0;background:repeating-linear-gradient(45deg,rgba(255,70,70,.95) 0 14px,rgba(20,8,8,.92) 14px 28px);box-shadow:0 0 16px rgba(255,60,60,.65)}
.ov-cert .strip.top{top:0;left:0;right:0;height:0}
.ov-cert .strip.bottom{bottom:0;left:0;right:0;height:0}
.ov-cert .strip.left{top:0;bottom:0;left:0;width:0}
.ov-cert .strip.right{top:0;bottom:0;right:0;width:0}
.ov-cert.on .strip.top,.ov-cert.on .strip.bottom{animation:fxCertGrowH 2s ease-out forwards}
.ov-cert.on .strip.left,.ov-cert.on .strip.right{animation:fxCertGrowV 2s ease-out forwards}
@keyframes fxCertGrowH{0%{height:0;opacity:0}15%{opacity:1}100%{height:13px;opacity:1}}
@keyframes fxCertGrowV{0%{width:0;opacity:0}15%{opacity:1}100%{width:13px;opacity:1}}
#play .wrap.shakeSm{animation:fxShakeSm .15s linear infinite}
#play .wrap.shakeLg{animation:fxShakeLg .11s linear infinite}
@keyframes fxShakeSm{0%{transform:translate(0,0)}25%{transform:translate(3px,-3px)}50%{transform:translate(-3px,3px)}75%{transform:translate(3px,3px)}100%{transform:translate(0,0)}}
@keyframes fxShakeLg{0%{transform:translate(0,0) rotate(0deg)}20%{transform:translate(11px,-9px) rotate(.7deg)}40%{transform:translate(-13px,7px) rotate(-.9deg)}60%{transform:translate(9px,11px) rotate(.7deg)}80%{transform:translate(-9px,-7px) rotate(-.5deg)}100%{transform:translate(0,0) rotate(0deg)}}
.ov-shaketint{background:radial-gradient(120% 100% at 50% 100%,rgba(255,80,40,.4),transparent 62%)}
.ov-shaketint.on{animation:fxShakeTint 2s ease-in-out infinite}
@keyframes fxShakeTint{0%,100%{opacity:.18}50%{opacity:.5}}
.ov-ulte{display:flex;align-items:flex-end;justify-content:flex-end;padding:18px}
.ov-ulte .sigbars{display:flex;align-items:flex-end;gap:3px;height:28px}
.ov-ulte .sigbars i{display:block;width:6px;background:#bfe0ff;border-radius:1px;box-shadow:0 0 6px rgba(190,224,255,.8)}
.ov-ulte .sigbars i:nth-child(1){height:30%}
.ov-ulte .sigbars i:nth-child(2){height:55%}
.ov-ulte .sigbars i:nth-child(3){height:75%}
.ov-ulte .sigbars i:nth-child(4){height:100%}
.ov-ulte.on .sigbars{animation:fxSigDrop 2s steps(1,end) forwards}
@keyframes fxSigDrop{0%{opacity:1}8%{opacity:.15}16%{opacity:1}24%{opacity:.15}34%{opacity:1}40%{opacity:.1}48%{opacity:1}53%{opacity:.1}60%{opacity:1}64%{opacity:.1}70%{opacity:1}73%{opacity:.1}78%{opacity:1}80%{opacity:.1}84%{opacity:1}86%{opacity:.1}90%{opacity:1}92%{opacity:.1}96%{opacity:1}98%{opacity:.1}100%{opacity:.3}}
.ov-ultenoise{position:absolute;left:0;right:0;height:20px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.9) 0 2px,transparent 2px 5px);mix-blend-mode:overlay;opacity:0}
.ov-ultenoise.on{animation:fxNoiseBar 2s steps(1,end) forwards}
@keyframes fxNoiseBar{0%{top:10%;opacity:0}10%{opacity:.8}14%{opacity:0}30%{top:40%;opacity:.8}34%{opacity:0}50%{top:65%;opacity:.9}54%{opacity:0}70%{top:25%;opacity:.9}74%{opacity:0}88%{top:55%;opacity:1}93%{opacity:0}100%{opacity:0}}
.why{font:14px/1.5 var(--tc);color:#ff9a90;min-height:20px}.why.ok{color:var(--green)}
.shipbtn{height:74px;font-size:26px;letter-spacing:2px;width:100%}
.hint{font:13px/1.5 var(--tc);color:var(--mute)}
/* 彈窗 */
.modal{position:fixed;inset:0;z-index:40;display:none;place-items:center;padding:0;background:rgba(2,4,8,.75);backdrop-filter:blur(3px)}
.modal.on{display:grid}
.card{width:100%;height:100%;max-width:none;max-height:none;overflow:auto;padding:56px clamp(20px,6vw,64px) 32px;border-radius:0;display:flex;flex-direction:column;align-items:center}
.card>*{max-width:860px;width:100%;flex:none}
.card h2{margin:2px 0 8px;font:900 34px/1.15 var(--tc)}
.card h2.failTitle{color:var(--red)}
.failReasons{margin:10px 0 0;padding-left:20px;color:#ffb0a8;font:14.5px/1.7 var(--tc)}
.newmech{display:flex;gap:14px;align-items:center;padding:14px 16px;margin:10px 0;border-radius:14px;background:linear-gradient(90deg,rgba(255,198,90,.16),rgba(255,198,90,.03));border:1.5px solid rgba(255,198,90,.6);box-shadow:0 0 22px rgba(255,198,90,.12)}
.newmech .nmic{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:rgba(255,198,90,.16);border:1px solid rgba(255,198,90,.55)}
.newmech b{display:block;font:700 17px var(--tc);color:var(--gold)}.newmech span{display:block;min-height:3.2em;font:14.5px/1.6 var(--tc);color:#e1e5eb}
.row{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.lessonRow{display:flex;gap:16px;align-items:flex-end;margin-top:12px}
.lessonBoxes{flex:1;min-width:0;display:flex;flex-direction:column}
.lessonBoxes:empty{display:none}
.lessonRow:has(.lessonBoxes:empty){justify-content:flex-end}
/* 十年結算 */
.years{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin:10px 0 6px}
.yr{position:relative;height:62px;border-radius:12px;background:#0a1019;border:1.5px solid #212d40;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:5px;font:700 12px var(--game);color:var(--mute);transition:all .25s}
.yr.lit{border-color:var(--green);color:var(--green);background:#0f1a2a}
.yr.hit{border-color:var(--red);color:#fff;background:linear-gradient(180deg,#5a1612,#2a0b09);box-shadow:0 0 20px rgba(255,79,69,.5);animation:shake .35s}
.yr .ev{position:absolute;top:5px}
.yr .ev svg{width:18px;height:18px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.evlog{min-height:0;font:14px/1.45 var(--tc)}
.evlog div{animation:pop .3s}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.simStage{display:flex;flex-direction:column;gap:10px;min-width:0}
.simTop{flex:none}
.result{flex:none;opacity:0;pointer-events:none;transition:opacity .4s}
.result.on{opacity:1;pointer-events:auto}
.simResHd{display:flex;align-items:flex-end;justify-content:flex-end;gap:14px;margin:0 0 8px}
.bigscore{display:flex;align-items:center;gap:12px}
.bigscore b{font:700 44px/1 var(--game);background:linear-gradient(180deg,#fff6d2,#ffc65a 55%,#d1840f);-webkit-background-clip:text;background-clip:text;color:transparent}
.bigscore .stars .star{width:30px;height:30px;margin-right:2px;transform:scale(.3);opacity:0;transition:all .35s cubic-bezier(.2,1.6,.4,1)}
.bigscore .stars .star.show{transform:scale(1);opacity:1}
.bigscore .scLabel{font:700 20px var(--tc)}
.cmp{width:100%;border-collapse:collapse;font:14px/1.35 var(--tc)}
.cmp th{font:700 12px var(--tc);color:var(--mute);text-align:left;padding:4px 8px;border-bottom:1px solid #212d40}
.cmp td{padding:5px 8px;border-bottom:1px solid #162030;vertical-align:top}
.cmp .o{color:var(--amber)}.cmp .u{color:#ff8a80}.cmp .r{color:var(--green)}
.cmp td.w{color:#b9c0cb;font-size:13.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:60;padding:10px 18px;border-radius:12px;background:#1d0f0d;border:1px solid var(--red);font:700 15px var(--tc);transition:all .25s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.floatcoin{position:fixed;z-index:70;font:700 20px var(--game);color:var(--gold);pointer-events:none;animation:fly .7s forwards;text-shadow:0 2px 0 #000}

let AC = null;
function beep(type) {
  if (MUTE) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const seq = { click:[[660,.04]], add:[[520,.05],[780,.07]], err:[[200,.12]], ship:[[392,.08],[523,.08],[659,.08],[784,.16]], hit:[[150,.18]], star:[[880,.06],[1175,.1]], ok:[[523,.06],[784,.1]] }[type] || [[440,.05]];
    let t = AC.currentTime;
    for (const [f, d] of seq) { const o = AC.createOscillator(), g = AC.createGain(); o.type = type === "hit" || type === "err" ? "sawtooth" : "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.15, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02); t += d * .9; }
  } catch {}
}

function slotFallbackIcon(i) {

// 板型／補介面／規格卡共用同一套寬高（OPT_COLS 欄、同一個固定高），隨便抓目前畫面上活著的一張卡量，
// 比起去量「可能被隱藏、量到 0」的來源卡準確又不會有新舊尺寸不一致的問題。
function liveCardSize() { const c = document.querySelector(".page.on .ff,.page.on .ad,.page.on .tc"); return c ? c.getBoundingClientRect() : null; }
function renderPager() {
  $$(".page").forEach((p) => p.classList.toggle("on", +p.dataset.page === PAGE));
  $("#pageSlots").innerHTML = [...Array(PAGE_COUNT)].map((_, i) => {
    const label = slotLabel(i);

    return `<div class="pslot ${i === PAGE ? "cur" : ""} ${label ? "done" : ""} ${hasClone ? "vis-only" : ""}" data-i="${i}"><div class="pslotVis"></div>${!hasClone && label ? `<b>${label}</b>` : ""}</div>`;
  }).join("");
  const sr = liveCardSize();
  $$("#pageSlots .pslot").forEach((el, i) => {
    const vis = el.querySelector(".pslotVis");
    if (i === 0 && B.board) {
      const b = SQ.BOARDS.find((x) => x.id === B.board);
      const pr = vis.getBoundingClientRect();
      const scale = (pr.width - 10) / 305; // 305=ATX長邊，當作最大版型比例尺基準
      const w = b.len * scale, h = FFH[b.ff] * scale;
      vis.classList.remove("ic");
      vis.innerHTML = `<div style="position:absolute;left:50%;top:50%;width:${w}px;height:${h}px;transform:translate(-50%,-50%);border:1.5px solid #bfe0ff;border-radius:3px;background:rgba(63,127,224,.22);opacity:.7"></div>`;
      return;
    }
    const src = slotSourceCard(i);
    const onscreen = src && src.closest(".page")?.classList.contains("on");
    if (onscreen) { const c = src.cloneNode(true);
      c.removeAttribute("id"); c.removeAttribute("data-i"); c.removeAttribute("data-k"); c.removeAttribute("data-b");
      c.querySelectorAll("button").forEach((n) => n.remove());
      c.querySelectorAll("[id]").forEach((n) => n.removeAttribute("id"));
      SLOT_CACHE[i] = c;
    }
    const cached = SLOT_CACHE[i];
    if (cached && sr) {
      const pr = vis.getBoundingClientRect();
      const scale = Math.min(pr.width / sr.width, pr.height / sr.height) || 1;
      const clone = cached.cloneNode(true);
      clone.style.cssText = `position:absolute;left:50%;top:50%;width:${sr.width}px;height:${sr.height}px;transform:translate(-50%,-50%) scale(${scale});pointer-events:none`;
      vis.appendChild(clone);

  });
  $$("#pageSlots .pslot").forEach((x) => x.onclick = () => { PAGE = +x.dataset.i; beep("click"); renderPager(); });

}

/* ---------- 關卡時限 ---------- */
/* 倒數壓力特效：遊玩倒數時每10秒隨機觸發一種(2秒)，結算揭曉缺點時依事件id觸發對應效果(較短) */
const RISK_FX = ["temp", "power", "prot", "protusb", "store", "supply", "cert", "ucom", "ucan", "ulte"];
let riskFxLoopId = null, riskFxClearId = null, riskFxLast = null;
function clearRiskFx() {
  clearTimeout(riskFxClearId);
  $$("#riskFx .ov, #riskFx .ov *").forEach((el) => {
    el.classList.remove("on"); el.style.animationDuration = ""; el.style.animationDelay = ""; el.style.animation = "none"; void el.offsetWidth; el.style.animation = "";
  });
  $("#play .wrap").classList.remove("shakeSm", "shakeLg");
}
const RISK_FX_DUR = {
  temp: [["#fxTemp", 1]], power: [["#fxPower", 1]],
  prot: [["#fxProt", 1], ["#fxProt path", 1]],
  protusb: [["#fxProtUsb", 1]],
  store: [["#fxStore", 2]],
  supply: [["#fxSupply", 1]],
  cert: [["#fxCert .strip", 1]],
  ulte: [["#fxUlte .sigbars", 1], ["#fxUlteNoise", 1]],
};
function playRiskFx(id, dur) {
  clearRiskFx();
  const d = dur || 2000;
  if (id === "temp") $("#fxTemp").classList.add("on");
  else if (id === "power") $("#fxPower").classList.add("on");
  else if (id === "prot") $("#fxProt").classList.add("on");
  else if (id === "protusb") $("#fxProtUsb").classList.add("on");
  else if (id === "store") $("#fxStore").classList.add("on");
  else if (id === "supply") $("#fxSupply").classList.add("on");
  else if (id === "cert") $("#fxCert").classList.add("on");
  else if (id === "ucom") { $("#play .wrap").classList.add("shakeSm"); $("#fxShakeTint").classList.add("on"); }
  else if (id === "ucan") { $("#play .wrap").classList.add("shakeLg"); $("#fxShakeTint").classList.add("on"); }
  else if (id === "ulte") { $("#fxUlte").classList.add("on"); $("#fxUlteNoise").classList.add("on"); }
  const FULL = 2000;
  (RISK_FX_DUR[id] || []).forEach(([sel, animCount]) => {
    $$(sel).forEach((el) => {
      if (d >= FULL) { el.style.animationDuration = animCount > 1 ? (d + "ms, 120ms") : d + "ms"; return; }
      // 短版(結算揭曉用)：時長維持原本2秒的曲線不變，用負延遲直接跳到「已經很明顯」的那段，只播出剩下 d 毫秒，
      // 不然把整條慢慢堆疊的曲線硬壓縮進 d 毫秒，畫面根本還沒堆到看得出來就被切掉了
      el.style.animationDuration = animCount > 1 ? (FULL + "ms, 120ms") : FULL + "ms";
      el.style.animationDelay = animCount > 1 ? (-(FULL - d) + "ms, 0ms") : -(FULL - d) + "ms";
    });
  });
  riskFxClearId = setTimeout(clearRiskFx, d);
}
function startRiskFxLoop() {
  stopRiskFxLoop();
  riskFxLoopId = setInterval(() => {
    const pool = RISK_FX.filter((x) => x !== riskFxLast);
    const pick = pool[Math.floor(Math.random() * pool.length)];
    riskFxLast = pick;
    playRiskFx(pick, 2000);
  }, 10000);
}
function stopRiskFxLoop() { clearInterval(riskFxLoopId); riskFxLoopId = null; clearRiskFx(); }
function startTimer() {
  if (!TIME_LEFT) return;
  renderTimer();
  clearInterval(TIMER_ID);
  TIMER_ID = setInterval(() => {
    TIME_LEFT--; renderTimer();
    if (TIME_LEFT <= 0) { clearInterval(TIMER_ID); TIMER_ID = null; stopRiskFxLoop(); timeUp(); }
  }, 1000);
  startRiskFxLoop();
}
function stopTimer() { clearInterval(TIMER_ID); TIMER_ID = null; stopRiskFxLoop(); }
function renderTimer() {
  const els = $$(".shipTimer"); if (!els.length) return;
  if (!TIME_LEFT) { els.forEach((el) => el.style.display = "none"); return; }
  const v = Math.max(0, TIME_LEFT), m = Math.floor(v / 60), s = v % 60;
  els.forEach((el) => { el.style.display = ""; el.textContent = `${m}:${String(s).padStart(2, "0")}`; el.classList.toggle("low", v <= 10);
    el.classList.remove("tick"); void el.offsetWidth; el.classList.add("tick"); });
}

  } else {

    // 擴充槽與立起來的卡

    for (let i = 0; i < (B.add.lan2 || 0); i++) cardsIn.push({ c: "lan2", cls: "mine" });
    const placed = slots.map(() => null), used = new Set();
    cardsIn.forEach((ci) => { let k = slots.findIndex((sl, j) => !used.has(j) && (ci.need === "x16" ? sl === "x16" : sl === "x4")); if (k < 0) k = slots.findIndex((sl, j) => !used.has(j)); if (k >= 0) { used.add(k); placed[k] = ci; } });
    const sy0 = bh * .66, step = Math.min(22, (bh * .3) / Math.max(1, slots.length));

    // M.2

    const price = cur.custom ? fmt(cur.price + SQ.COME_NRE / CUR.vol) : cur.price;
    const varBtns = vars.length > 1 ? `<div class="var">${vars.map((v) => `<button data-b="${v.id}" class="${sel && sel.id === v.id ? "on" : ""}">${(ff === "sbc" ? TXT[LANG].varSbc : TXT[LANG].var)[v.v]}</button>`).join("")}</div>` : "";
    const note = cur.custom ? `<div class="hint" style="margin-top:4px">${T("comeNote", {nre: fmt(SQ.COME_NRE), vol: fmt(CUR.vol)})}</div>` : "";
    return `<div class="ffCell">
      <div class="ff ${sel && sel.ff === ff ? "sel" : ""} ${lock ? "lock" : ""}" data-b="${cur.id}" role="button" tabindex="0">
      <div class="h"><b>${T("ff." + ff)}</b>${badge}</div><div class="box"><div class="lim" style="width:${lim}px;height:${lim}px"></div><div class="sil" style="width:${silW}px;height:${silH}px"></div></div>
      <div class="prRow"><i class="coin"></i>${price}</div></div>${varBtns}${specOut}${note}${lockLine}</div>`;
  }).join("");
  $$(".specOut").forEach((el, i) => {
    const prev = prevSpecSpans[i]; if (!prev) return;
    [...el.querySelectorAll("span")].forEach((s, j) => { if (prev[j] !== undefined && prev[j] !== s.textContent) s.classList.add("flash"); });
  });
  $$("#ffr .ffCell").forEach((cell) => { const x = cell.querySelector(".ff");
    const pick = (id) => { if (x.classList.contains("lock")) { beep("err"); toast(T("needToast", {n: unlockLevel("custom")})); return; }
      const nb = SQ.BOARDS.find((b) => b.id === id); if (id !== B.board && Object.keys(B.add).length) { B.add = {}; toast(T("addonReset")); } B.board = id; FF_LAST[nb.ff] = id; beep("add"); flyToSlot(x, 0); renderAll(); };
    cell.onclick = (ev) => { const vb = ev.target.closest("button[data-b]"); pick(vb ? vb.dataset.b : (B.board && SQ.BOARDS.find((b) => b.id === B.board).ff === SQ.BOARDS.find((b) => b.id === x.dataset.b).ff ? B.board : x.dataset.b)); };
    x.onkeydown = (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); x.click(); } }; });
}

function renderShip() {
  const e = evalNow();
  const cost = e ? e.buy : 0;
  $("#costBig").textContent = fmt(cost);
  const cb = $("#costBreak");
  if (e) { const hwPart = e.hw * SQ.TIERS[0].cost[B.t[0]]; cb.textContent = T("costBreak", {hw: fmt(hwPart), spec: fmt(e.buy - hwPart)}); cb.style.display = ""; }
  else cb.style.display = "none";
  const why = $("#why");
  if (!e) { why.className = "why"; why.textContent = T("reason.noBoard"); $("#bShip").disabled = true; return; }
  if (e.ok) { why.className = "why ok"; why.textContent = "✓ " + T("ready"); $("#bShip").disabled = false; }
  else { why.className = "why"; why.textContent = "✕ " + [...new Set(e.reasons)].map((r) => T("reason." + r)).join("；"); $("#bShip").disabled = true; }
}

/* ---------- 出貨與十年結算 ---------- */
function ship(force) {
  if ($("#mSim").classList.contains("on")) return;
  const r = SQ.score(CUR, B);
  if (!r.e.ok) { if (!force) return; showFail(r); return; }
  stopTimer();
  beep("ship");
  const prev = PROG[CUR.id]; if (prev == null || r.score > prev) { PROG[CUR.id] = r.score; store.set("prog", PROG); }
  const events = r.items.filter((x) => x.kind === "under").map((x) => ({ id: x.id, y: TXT[LANG].evYear[x.id] || 3, v: x.v }));
  const card = $("#simCard");
  card.innerHTML = `<div class="k">${T("lv", {n: CUR.id})} · ${L(CUR.id).n}</div><h2>${T("simTitle")}</h2>
   <div class="simStage">
    <div class="simTop">
     <div class="years">${[...Array(10)].map((_, i) => `<div class="yr" id="y${i + 1}"><span class="ev"></span>${T("year", {n: i + 1})}</div>`).join("")}</div>
     <div class="evlog" id="evlog"></div>
    </div>
    <div class="result" id="res"></div>
   </div>`;
  $("#mSim").classList.add("on");
  const playScore = buildResult(r);
  let y = 0, done = false;
  const step = () => {
    if (done) return; y++;
    const evs = events.filter((x) => x.y === y), cell = $("#y" + y);
    if (evs.length) { cell.classList.add("hit"); cell.querySelector(".ev").innerHTML = ic("bolt", 26); beep("hit");
      evs.forEach((x) => $("#evlog").insertAdjacentHTML("beforeend", `<div><b style="color:#ff8a80">${T("year", {n: y})}</b>　${TXT[LANG].ev[x.id]}　<b style="color:#ff8a80">−${fmt(x.v)}</b></div>`));
      playRiskFx(evs[0].id.replace("_", ""), 480); }
    else { cell.classList.add("lit"); cell.querySelector(".ev").innerHTML = ic("badge", 22); }
    if (y < 10) step._t = setTimeout(step, evs.length ? 650 : 260); else finish();
  };
  const finish = () => { if (done) return; done = true; clearTimeout(step._t);
    if (!events.length) $("#evlog").innerHTML = `<div style="color:var(--green)">${T("calm")}</div>`;
    $("#res").classList.add("on"); playScore(); };
  step._t = setTimeout(step, 400);
}
function showFail(r) {
  stopTimer();
  beep("err");
  const reasons = [...new Set(r.e.reasons)].map((x) => T("reason." + x));
  $("#simCard").innerHTML = `<div class="k" style="color:var(--red)">${T("lv", {n: CUR.id})} · ${L(CUR.id).n}</div>
   <h2 class="failTitle">${T("failTitle")}</h2>
   <p class="story">${T("failSub")}</p>
   <ul class="failReasons">${reasons.map((x) => `<li>${x}</li>`).join("")}</ul>
   <div class="row"><button class="btn ghost" id="bFailMap">${T("toMap")}</button><button class="btn" id="bFailRetry">${T("retry")}</button></div>`;
  $("#mSim").classList.add("on");
  $("#bFailMap").onclick = () => { beep("click"); $("#mSim").classList.remove("on"); stopBgm(); show("map"); renderMap(); };
  $("#bFailRetry").onclick = () => { beep("click"); $("#mSim").classList.remove("on"); TIME_LEFT = TIME_BUDGET[CUR.id] || 0; startTimer(); };
}
function buildResult(r) {
  const res = $("#res"), st = SQ.stars(r.score), best = r.best, t = L(CUR.id);
  const nm = (bid) => { const b = SQ.BOARDS.find((x) => x.id === bid); const vs = SQ.BOARDS.filter((x) => x.ff === b.ff); return T("ff." + b.ff) + (vs.length > 1 ? " " + (b.ff === "sbc" ? TXT[LANG].varSbc : TXT[LANG].var)[b.v] : ""); };
  const addStr = (a) => Object.entries(a).map(([k, v]) => `${TXT[LANG].addon[k]}×${v}`).join("、");
  const pick = nm(B.board) + (addStr(B.add) ? " ＋ " + addStr(B.add) : ""), right = nm(best.board) + (addStr(best.add) ? " ＋ " + addStr(best.add) : "");
  const hwItem = r.items.filter((x) => ["hw","ucom","ucan","ulte","prot_usb"].includes(x.id)).reduce((s, x) => s + (x.kind === "over" ? x.v : -x.v), 0);
  let rows = `<tr><td>${T("boardRow")}</td><td data-l="${T("yourPick")}">${pick}</td><td class="r" data-l="${T("right")}">${right}</td><td class="${hwItem > 0 ? "o" : hwItem < 0 ? "u" : "r"}" data-l="${T("diff")}">${hwItem > 0 ? T("over", {v: fmt(hwItem)}) : hwItem < 0 ? T("under", {v: fmt(-hwItem)}) : (B.board === best.board && addStr(B.add) === addStr(best.add) ? T("same") : "—")}</td><td class="w">${t.w.board}</td></tr>`;
  SQ.TIERS.forEach((Tr, i) => {
    const o = TXT[LANG].tierOpt[Tr.id], k = B.t[i], n = CUR.need[i], it = r.items.find((x) => x.id === Tr.id);
    const cls = k > n ? "o" : k < n ? "u" : "r", d = it ? (it.kind === "over" ? T("over", {v: fmt(it.v)}) : T("under", {v: fmt(it.v)})) : T("same");
    rows += `<tr><td>${T("tier." + Tr.id)}${isUnlocked(Tr.id) ? "" : " " + ic("lock", 12).replace('class="ic"', 'class="ic" style="display:inline"')}</td><td class="${cls}" data-l="${T("yourPick")}">${o[k]}</td><td class="r" data-l="${T("right")}">${o[n]}</td><td class="${cls}" data-l="${T("diff")}">${d}</td><td class="w">${t.w[Tr.id]}</td></tr>`;
  });
  const last = CUR.id === 10, nextOpen = !last;
  res.innerHTML = `<div class="simResHd"><div class="bigscore"><b id="scNum">0</b><div class="stars">${[0,1,2].map((i) => `<span class="star ${i < st ? "on" : ""}"></span>`).join("")}</div></div><div class="scLabel">${TXT[LANG].stars[st]}</div></div>
   <table class="cmp"><tr><th></th><th>${T("yourPick")}</th><th>${T("right")}</th><th>${T("diff")}</th><th class="w">${T("reason2")}</th></tr>${rows}</table>
   ${last && st >= 1 ? `<div class="newmech" style="margin-top:14px">${ic("badge", 34)}<div><b>${T("allDone")}</b><span>${T("allDoneSub", {s: SQ.LEVELS.reduce((s, l) => s + starsOf(l.id), 0)})}</span></div></div>` : ""}
   <div class="row"><button class="btn ghost" id="bMap2">${T("toMap")}</button><button class="btn ghost" id="bRetry">${T("retry")}</button>${nextOpen ? `<button class="btn" id="bNext">${T("next")}</button>` : ""}</div>`;
  $("#bRetry").onclick = () => { beep("click"); $("#mSim").classList.remove("on"); TIME_LEFT = TIME_BUDGET[CUR.id] || 0; startTimer(); };
  $("#bMap2").onclick = () => { beep("click"); $("#mSim").classList.remove("on"); stopBgm(); show("map"); renderMap(); };
  if (nextOpen) $("#bNext").onclick = () => { beep("click"); $("#mSim").classList.remove("on"); startLevel(CUR.id + 1); };
  renderHud();
  return () => { let v = 0; const tgt = r.score, num = $("#scNum"); const tick = () => { v = Math.min(tgt, v + Math.max(1, Math.round(tgt / 25))); num.textContent = v; if (v < tgt) setTimeout(tick, 24); else $$("#res .stars .star").forEach((s, i) => setTimeout(() => { s.classList.add("show"); if (s.classList.contains("on")) beep("star"); }, 180 * i)); }; tick(); };
}

/* ---------- 綁定 ---------- */
function enterGame() { beep("ok"); $("#bgmTitle").pause(); show("map"); renderMap(); goFullscreen(); }
$("#heroTap").onclick = enterGame;
$("#heroTap").onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); enterGame(); } };
function openInfo() {
  $("#infoCard").innerHTML = `<p style="font:14px/1.65 var(--tc);color:var(--mute);margin:4px 0 18px">${T("foot")}</p><div class="row"><button class="btn ghost" id="bInfoClose">${T("certClose")}</button></div>`;
  $("#mInfo").classList.add("on");
  $("#bInfoClose").onclick = () => { beep("click"); $("#mInfo").classList.remove("on"); };
}
$("#bInfo").onclick = () => { beep("click"); openInfo(); };
$("#bMapBack").onclick = () => { beep("click"); stopBgm(); show("title"); playTitleBgm(); };
$("#bToMap").onclick = () => { beep("click"); stopTimer(); stopBgm(); show("map"); renderMap(); };
$("#bMView").onclick = () => { beep("click"); setMView(MVIEW === "top" ? "bottom" : "top"); };
$("#stage3d").onclick = () => { if (MVIEW === "top") { beep("click"); setMView("bottom"); } };
$("#bMapMView").onclick = () => { beep("click"); setMapMView(MAP_MVIEW === "top" ? "bottom" : "top"); };
enableSwipeMView($("#map .wrap"), () => MAP_MVIEW, setMapMView);
$$(".bFs").forEach((x) => x.onclick = () => { beep("click"); toggleFullscreen(); });
enableSwipeMView($("#play .wrap"), () => MVIEW, setMView);
$("#bShip").onclick = ship;
$("#bPagePrev").onclick = () => { if (PAGE > 0) { PAGE--; beep("click"); renderPager(); } };
$("#bPageNext").onclick = () => { if (PAGE < PAGE_COUNT - 1) { PAGE++; beep("click"); renderPager(); } };
$$(".bLang").forEach((x) => x.onclick = () => { LANG = LANG === "zh" ? "en" : "zh"; store.set("lang", LANG); beep("click"); i18n(); if ($("#mBrief").classList.contains("on")) openBrief(); });
$$(".bSnd").forEach((x) => x.onclick = () => { MUTE = !MUTE; store.set("mute", MUTE); i18n(); beep("click");
  if (MUTE) { stopBgm(); $("#bgmLoad").classList.remove("on"); }
  else if ($("#play").classList.contains("on")) playBgm();
  else if ($("#title").classList.contains("on")) playTitleBgm(); });
["bgmTitle", "bgmPractice", "bgmFormal"].forEach((id) => wireBgmLoading($(`#${id}`)));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { $("#mBrief").classList.remove("on"); $("#mCert").classList.remove("on"); $("#mInfo").classList.remove("on"); } });
// 瀏覽器會擋在使用者互動前自動播放音訊，第一次互動時才真的播放標題配樂
["click", "keydown"].forEach((ev) => document.addEventListener(ev, () => { if (!MUTE && $("#title").classList.contains("on")) playTitleBgm(); }, { once: true }));
let _rz; window.addEventListener("resize", () => { clearTimeout(_rz); _rz = setTimeout(() => { if ($("#play").classList.contains("on")) { renderScene(); renderPager(); } }, 120); });
i18n();
// 測試用掛鉤（不影響遊玩）
window.__sq = { startLevel, get B() { return B; }, set B(v) { B = v; }, renderAll, ship, show, renderMap, prog: () => PROG };
</script>
