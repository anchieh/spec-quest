<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spec Quest · 選型大挑戰</title>
<meta name="description" content="A browser game about choosing industrial PC specs: just enough wins.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;600;700;900&display=swap">
<style>
:root{--bg:#05100c;--ink:#f1f6f3;--mute:#93a9a0;--line:#2a4b3b;--gold:#ffc65a;--red:#ff4f45;--teal:#3fe0bb;--amber:#ffa53a;--green:#45d18a;--blue:#5aa2ea;
 --game:"Chakra Petch","Noto Sans TC","Segoe UI",sans-serif;--tc:"Noto Sans TC","Microsoft JhengHei","PingFang TC","Segoe UI",sans-serif;--mono:"IBM Plex Mono",Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{font-family:var(--tc);color:var(--ink);overflow-x:hidden;
 background:radial-gradient(1100px 620px at 50% 30%,#12382a 0%,transparent 70%),linear-gradient(180deg,#05100c,#081a12 60%,#061009);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.4;background-image:linear-gradient(rgba(255,170,80,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,170,80,.07) 1px,transparent 1px);background-size:40px 40px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.screen{display:none;position:relative;min-height:100vh}.screen.on{display:block}
.wrap{max-width:1600px;margin:0 auto;padding:14px 20px 24px}
.pn{border-radius:16px;background:linear-gradient(180deg,rgba(16,38,28,.92),rgba(7,20,14,.92));border:1px solid var(--line);box-shadow:0 20px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05)}
.k{font:800 13px var(--game);letter-spacing:1.5px;color:var(--gold);text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 26px;border-radius:14px;font:900 18px var(--tc);letter-spacing:2px;color:#2a1600;
 background:linear-gradient(180deg,#ffe29a,#ffc65a 50%,#d1840f);box-shadow:0 6px 0 #7a4a0a,0 12px 24px rgba(255,198,90,.3),inset 0 2px 0 rgba(255,255,255,.55);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #7a4a0a}
.btn.ghost{color:var(--ink);background:linear-gradient(180deg,#1d4a37,#0f2a1f);box-shadow:0 5px 0 #06140d,inset 0 1px 0 rgba(255,255,255,.1);border:1px solid #3a6a54}
.btn[disabled]{filter:grayscale(1) brightness(.45);opacity:.7;cursor:not-allowed;box-shadow:none}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#0f2a1f;border:1px solid #2f5541;font:800 14px var(--game)}
svg.ic{display:block}
.coin{display:inline-block;width:20px;height:20px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff3c4,#ffc54a 45%,#b8700c);box-shadow:inset 0 -2px 0 rgba(0,0,0,.3)}
.star{width:22px;height:22px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:#21402f;display:inline-block}
.star.on{background:linear-gradient(180deg,#ffe08a,#ffad1f)}
/* ---------- 標題 ---------- */
#title .hero{min-height:100vh;display:grid;place-items:center;text-align:center;padding:30px 20px}
.logo{font:900 clamp(44px,8vw,96px)/1 var(--game);letter-spacing:4px;background:linear-gradient(180deg,#fff6d2,#ffc65a 55%,#d1840f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 #3a2208) drop-shadow(0 0 30px rgba(255,198,90,.35))}
.logo2{font:900 clamp(26px,3.8vw,42px) var(--tc);letter-spacing:3px;margin-top:10px;text-shadow:0 3px 0 #000}
.tag{max-width:680px;margin:22px auto 30px;font:17px/1.75 var(--tc);color:#c1d2c8}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:-10px 0 28px}
.chip{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;background:#0e2419;border:1px solid #2f5541;font:700 15px var(--tc)}
.tbar{position:absolute;top:14px;right:16px;display:flex;gap:8px;z-index:5}
.heroboard{position:relative;height:150px;margin:-10px auto 6px;width:300px;perspective:900px}
.hb{position:absolute;left:50%;top:50%;width:230px;height:150px;margin:-75px 0 0 -115px;border-radius:10px;transform-style:preserve-3d;background:radial-gradient(circle at 30% 25%,#1f7a52,#0d4a31 60%,#083522);box-shadow:0 30px 50px rgba(0,0,0,.7),0 0 40px rgba(63,224,187,.3);animation:spin 14s linear infinite}
@keyframes spin{from{transform:rotateX(58deg) rotateZ(0)}to{transform:rotateX(58deg) rotateZ(360deg)}}
.hb .trace{position:absolute;inset:0;opacity:.35;border-radius:10px;background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(150,230,190,.35) 22px 24px),repeating-linear-gradient(0deg,transparent 0 30px,rgba(150,230,190,.25) 30px 32px)}
.howto{margin-top:16px;padding:18px 20px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.howto .st{display:flex;gap:12px;align-items:flex-start}.howto .n{flex:none;width:34px;height:38px;display:grid;place-items:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--gold);color:#2a1600;font:900 16px var(--game)}
.howto b{display:block;font:800 15px var(--tc);margin-bottom:3px}.howto span{font:13px/1.55 var(--tc);color:#c1d2c8}
@media (max-width:1180px){.howto{grid-template-columns:1fr 1fr}}@media (max-width:720px){.howto{grid-template-columns:1fr}}
.foot{margin-top:34px;font:13px/1.65 var(--tc);color:var(--mute);max-width:720px}
/* ---------- 地圖 ---------- */
.mhd{display:flex;align-items:center;flex-wrap:wrap;gap:14px;margin:6px 0 16px}
.mhd h2{margin:0;font:900 56px var(--tc);letter-spacing:2px}.mhd .tot{margin-left:auto;display:flex;align-items:center;gap:8px;font:800 18px var(--game)}
.zones{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.zone{padding:16px;border-radius:18px;position:relative;overflow:hidden}
.zone h3{margin:0 0 4px;font:900 38px var(--tc);display:flex;align-items:center;gap:10px}.zone .zs{font:12px var(--tc);color:var(--mute);margin-bottom:12px}
.zone::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:var(--zc);opacity:.12}
.lvl{width:100%;display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:10px;border-radius:14px;text-align:left;background:#0b1d15;border:1.5px solid #24443a;transition:transform .12s,border-color .12s}
.lvl:hover:not([disabled]){transform:translateY(-2px);border-color:var(--zc)}
.lvl .no{width:44px;height:48px;flex:none;display:grid;place-items:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--zc);color:#03140e;font:900 18px var(--game)}
.lvl b{display:block;font:800 30px/1.15 var(--tc)}.lvl small{display:flex;gap:3px;margin-top:4px}.lvl small .star{width:15px;height:15px}
.lvl[disabled]{opacity:.45;cursor:not-allowed}.lvl.boss{border-color:#7a3a2c;background:linear-gradient(90deg,#2a1210,#0b1d15)}
/* ---------- 遊戲 ---------- */
.hud{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.hex{width:56px;height:62px;flex:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,#fff0b0,#e08a18 60%,#8a4d06);display:grid;place-items:center}
.hex .in{width:47px;height:53px;clip-path:inherit;background:radial-gradient(circle at 50% 35%,#1d3a2c,#07140d);display:grid;place-items:center}
.ttl small{display:block;font:700 12px var(--game);letter-spacing:3px;color:var(--gold)}.ttl b{font:900 52px/1.05 var(--tc);letter-spacing:1px}
.dots{display:flex;gap:5px}.dots i{width:24px;height:7px;border-radius:4px;background:#1d3a2c;transform:skewX(-20deg)}.dots i.d{background:var(--green)}.dots i.c{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.hud .sp{flex:1}
.costpill{display:flex;align-items:center;gap:10px;height:46px;padding:0 16px 0 10px;border-radius:12px;background:linear-gradient(180deg,#183626,#0a1c13);border:1px solid #2f5541}
.costpill b{font:700 24px var(--game);font-variant-numeric:tabular-nums}.costpill small{font:600 12px var(--tc);color:var(--mute)}
#play{height:100vh;overflow:hidden}
#play .wrap{height:100%;display:flex;flex-direction:column;overflow:hidden}
.topRow{display:grid;gap:14px;grid-template-columns:1.1fr 1fr .8fr;grid-template-rows:380px;margin-bottom:14px;flex:0 0 auto}
.stage3d,.scn,.shipbox{min-height:0;overflow-y:auto}
.scn{padding:16px}.tierPage{padding:14px;height:100%;overflow-y:auto;display:flex;flex-direction:column}
.tierPage .tr{flex:1;display:flex;flex-direction:column;justify-content:center}
.tierPage .tg{max-width:520px;width:100%;margin:0 auto}
.ffbox{padding:14px}.shipbox{padding:14px;display:flex;flex-direction:column;gap:10px}
.pager{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
.pagerHd{display:flex;align-items:center;justify-content:center;gap:16px;flex:0 0 auto}
.pageDots{display:flex;gap:7px}.pageDots i{width:8px;height:8px;border-radius:50%;background:#21402f;display:block;transition:all .15s}.pageDots i.done{background:var(--teal)}.pageDots i.cur{width:10px;height:10px;box-shadow:0 0 0 2px rgba(63,224,187,.5)}
.pages{position:relative;flex:1;min-height:0}
.page{display:none;height:100%;overflow-y:auto}
.page.on{display:block}
.scn .top{display:flex;gap:12px;align-items:center}.scn .ic{width:60px;height:60px;flex:none;border-radius:14px;display:grid;place-items:center;background:radial-gradient(circle,#2b5a44,#0b2219);border:2px solid var(--gold)}
/* 步驟序號 */
.stepno{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:7px;background:linear-gradient(180deg,#1f6e53,#0f3a2b);border:1px solid var(--teal);color:var(--ink);font:800 12px var(--tc);flex:0 0 auto;box-shadow:0 0 10px rgba(63,224,187,.35)}
.stepk{display:flex;align-items:center;gap:8px;margin-bottom:8px;font:800 12px var(--tc);letter-spacing:.5px;color:var(--teal);text-transform:uppercase}
.ffbox .hd .stepno,.tiers .hd .stepno{margin-right:2px}
.shelf .shelfhd{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin:2px 0 2px}.shelf .shelfhd b{font:800 26px var(--tc);letter-spacing:.5px}
.shipbox .stepk{margin-bottom:-2px}
/* 選板型前，規格與擴充先弱化，引導視線 */
.pn.needBoard{position:relative;opacity:.4;pointer-events:none;filter:saturate(.4)}
.pn.needBoard::after{content:attr(data-hint);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;font:800 13px/1.5 var(--tc);color:var(--gold);background:rgba(6,14,10,.6);border-radius:16px;opacity:1}
.scn h2{margin:2px 0 0;font:900 30px/1.15 var(--tc)}
.story{font:13.5px/1.65 var(--tc);color:#c1d2c8;margin:10px 0}
.clue{display:flex;gap:8px;align-items:flex-start;font:13px/1.4 var(--tc);color:#d8e5dd;margin:3px 0}.clue i{flex:none;width:8px;height:8px;margin-top:5px;transform:rotate(45deg);background:var(--gold)}
.briefCtx .story{font-size:15px}
.briefCtx.sec{opacity:.65}.briefCtx.sec .story{font-size:12.5px;margin:8px 0 4px}.briefCtx.sec .clue{font-size:11.5px;color:var(--mute)}.briefCtx.sec .clue i{width:6px;height:6px;margin-top:5px}
.mechk{font:800 13px var(--game);letter-spacing:1.5px;color:var(--gold);text-transform:uppercase;margin:16px 0 6px}
.req{display:flex;align-items:center;gap:10px;padding:5px 10px;margin-top:5px;border-radius:10px;background:#0a1912;border:1px solid #21402f;font:700 13px var(--tc)}
.ctxk{font:800 12px var(--tc);letter-spacing:.5px;color:var(--mute);text-transform:uppercase;margin-bottom:8px}
.sect{font:800 13px var(--game);letter-spacing:1.2px;color:var(--mute);margin:14px 0 4px}
/* 3D 場景 */
.stage3d{position:relative;overflow:hidden;border-radius:16px}
.scene{position:absolute;left:50%;top:50%;transform-style:preserve-3d}
.enc{position:absolute;border:3px dashed rgba(255,198,90,.85);border-radius:10px;background:rgba(255,198,90,.03);box-shadow:0 0 30px rgba(255,198,90,.2)}
.enc.bad{border-color:rgba(255,79,69,.9);box-shadow:0 0 40px rgba(255,79,69,.4)}
.enc span{position:absolute;left:8px;bottom:-30px;font:800 14px var(--tc);color:var(--gold);white-space:nowrap}
.pcb{position:absolute;border-radius:8px;transform-style:preserve-3d;background:radial-gradient(circle at 30% 25%,#1f7a52,#0d4a31 60%,#083522);box-shadow:0 0 0 2px #0a2e1e,0 40px 60px rgba(0,0,0,.8),0 0 40px rgba(63,224,187,.2);transition:all .35s}
.pcb.come{background:radial-gradient(circle at 30% 25%,#2a5f8c,#173a5a 60%,#0e2840)}
.pcb .trace{position:absolute;inset:0;opacity:.35;background:repeating-linear-gradient(90deg,transparent 0 24px,rgba(150,230,190,.35) 24px 26px),repeating-linear-gradient(0deg,transparent 0 38px,rgba(150,230,190,.25) 38px 40px);-webkit-mask-image:radial-gradient(circle at 60% 60%,#000 30%,transparent 80%)}
.hole{position:absolute;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle,#05100c 40%,#e8c06a 45%,#a8771f 70%)}
.silk{position:absolute;left:12px;bottom:8px;font:600 10px var(--mono);letter-spacing:2px;color:rgba(232,239,233,.75);white-space:nowrap}
.cpu{position:absolute;border-radius:5px;background:#2a2f33;transform:translateZ(5px)}
.fins{position:absolute;inset:-5px;border-radius:5px;transform:translateZ(18px);background:repeating-linear-gradient(90deg,#c9d3db 0 4px,#7d8a95 4px 8px);box-shadow:0 10px 18px rgba(0,0,0,.6)}
.dimm{position:absolute;width:9px;border-radius:2px;background:linear-gradient(90deg,#1b1b1b,#333);transform:translateZ(6px)}
.slot{position:absolute;height:10px;border-radius:2px;background:#151515;box-shadow:0 0 0 1px #000}
.slot.x16{background:#1a1a2a}
.m2s{position:absolute;width:56px;height:16px;border-radius:2px;background:rgba(0,0,0,.35);border:1px dashed rgba(255,255,255,.35)}
.m2s.used{background:linear-gradient(90deg,#2f6fb5,#5aa2ea);border:0;box-shadow:0 0 14px rgba(90,162,234,.8);transform:translateZ(3px)}
.m2s b{position:absolute;inset:0;display:grid;place-items:center;font:800 9px var(--mono);color:#fff}
.stand{position:absolute;height:0;transform-style:preserve-3d}
.stand .face{position:absolute;left:0;top:0;transform-origin:top;border-radius:5px 5px 0 0;display:flex;flex-direction:column;justify-content:center;padding:0 8px;font:900 12px var(--tc);color:#03140e;box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)}
.stand.mine .face{background:linear-gradient(180deg,#30f2c6,#13916f);box-shadow:0 0 30px rgba(63,224,187,.7),inset 0 0 0 2px rgba(255,255,255,.4)}
.stand.cust .face{background:linear-gradient(180deg,#c9d3db,#7d8a95);color:#0b1d15}
.stand.gpu .face{background:linear-gradient(180deg,#b78cff,#6a3fc4);color:#fff;box-shadow:0 0 26px rgba(183,140,255,.6),inset 0 0 0 2px rgba(255,255,255,.35)}
.rear{position:absolute;left:0;top:-3px;height:0;transform-style:preserve-3d}
.port{position:absolute;top:0;height:24px;transform-origin:top;transform:rotateX(-90deg);border-radius:3px;background:linear-gradient(180deg,#a9b4bd,#6f7b84);display:grid;place-items:center}
.port i{display:block;border-radius:2px}
.port.db{width:34px}.port.db i{width:22px;height:9px;background:#1f3d8a;clip-path:polygon(0 0,100% 0,88% 100%,12% 100%)}
.port.lan{width:26px}.port.lan i{width:14px;height:11px;background:#111}
.dng{position:absolute;top:-34px;width:18px;height:26px;border-radius:4px;background:linear-gradient(180deg,#ff7a6b,#b52a20);box-shadow:0 0 14px rgba(255,79,69,.8);transform:rotateX(-90deg) translateY(-20px);transform-origin:top}
.sceneinfo{position:absolute;left:14px;top:12px;display:flex;flex-wrap:wrap;gap:6px;z-index:2}
.sceneinfo span{font:700 12px var(--tc);padding:4px 10px;border-radius:8px;background:rgba(6,14,10,.85);border:1px solid #3a5e4b}
.sceneinfo span.lv{border-color:var(--teal);color:var(--teal)}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:700 16px var(--tc);color:var(--mute)}
/* 擴充 */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;padding:10px;align-content:start}
.ad{display:flex;align-items:center;gap:6px;padding:5px 5px 5px 8px;border-radius:12px;background:#0a1912;border:1.5px solid #21402f;min-width:0;cursor:pointer}
.ad.trap{border-color:rgba(255,79,69,.45)}.ad.lock{opacity:.4}
.ad .nm{font:700 12.5px/1.25 var(--tc);flex:1;min-width:0}.ad .nm small{white-space:nowrap}.ad .nm small{display:block;font:600 11px var(--mono);color:var(--mute)}
.ad .nm .why{display:block;margin-top:4px;font:600 11.5px/1.5 var(--tc);color:#c8d6cd;white-space:normal}
.ad .ct{display:flex;align-items:center;gap:4px}.ad .ct b{width:18px;text-align:center;font:800 16px var(--game)}
.ad .ct button{width:38px;height:38px;border-radius:10px;background:#163a2b;border:1px solid #2f5541;font:900 20px var(--game);line-height:1}
.ad .ct button:disabled{opacity:.3;cursor:not-allowed}
/* 分級 */
.tiers .hd,.ffbox .hd{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}.tiers .hd b,.ffbox .hd b{font:800 34px var(--tc);letter-spacing:1px}.tiers .hd span,.ffbox .hd span{font:12px var(--tc);color:var(--mute)}
.tr{margin-bottom:6px;padding:5px 10px 6px;border-radius:12px;background:#0a1912;border:1px solid #21402f}
.tn{display:flex;align-items:center;gap:8px;margin-bottom:2px;height:24px}.tn span{font:800 14px var(--tc)}.tn small{margin-left:auto;font:700 11px var(--tc);color:var(--mute)}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.tg.two{grid-template-columns:repeat(2,1fr)}
.tc{padding:8px 6px;border-radius:8px;background:#071510;border:1.5px solid #1f3a2c;text-align:center;transition:all .12s}
.tc b{display:block;font:700 12px/1.3 var(--tc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tc small{display:block;font:600 10.5px/1.2 var(--mono);color:var(--mute)}
.tc:hover:not(:disabled){border-color:#3f7a62}
.tc.on{background:linear-gradient(180deg,#1f6e53,#0f3a2b);border-color:var(--teal);box-shadow:0 0 14px rgba(63,224,187,.4)}
.tr.locked{opacity:.75}.tr.locked .tc{cursor:not-allowed}.tr.locked .tc:not(.on){opacity:.35}
.lockb{display:inline-flex;align-items:center;gap:4px;font:700 11px var(--tc);color:var(--gold)}
.trWhy{font:12px/1.5 var(--tc);color:var(--mute)}.trWhy b{color:#c8d6cd;font-weight:700}
/* 板型 */
.ffr{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.ff{position:relative;border-radius:12px;padding:9px 10px;background:linear-gradient(180deg,#0f2419,#08160f);border:1.5px solid #24443a;text-align:left;transition:all .12s}
.ff:hover:not(.lock){border-color:#3f7a62;transform:translateY(-2px)}
.ff.sel{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal),0 0 24px rgba(63,224,187,.4);background:linear-gradient(180deg,#14402f,#0a1d14)}
.ff.lock{opacity:.4;cursor:not-allowed}
.ff .h{display:flex;align-items:center;gap:6px}.ff .h b{font:800 14px var(--game)}
.ff .model{font:700 10.5px var(--mono);color:var(--mute);letter-spacing:.3px;margin-top:2px}
.bd{margin-left:auto;font:800 10.5px var(--tc);padding:1px 7px;border-radius:5px;white-space:nowrap}
.bd.dim{border:1px solid var(--line);color:var(--mute);font:700 10.5px var(--mono)}.bd.lk{border:1px solid var(--gold);color:var(--gold)}
.box{position:relative;height:50px;margin:7px 0 6px;display:grid;place-items:center;border-radius:8px;background:#06120c;overflow:hidden}
.lim{position:absolute;border:2px dashed rgba(255,198,90,.75);border-radius:4px}
.sil{position:relative;border-radius:3px;background:linear-gradient(135deg,#2a9a6c,#0e4a31);box-shadow:0 0 0 1px #4fd1a0}
.spec{display:flex;flex-wrap:wrap;gap:4px;font:700 11px var(--game);color:#c8d6cd}.spec span{padding:1px 5px;border-radius:5px;background:#0a1c15}
.spec .pr{margin-left:auto;display:flex;align-items:center;gap:3px;background:none}.spec .coin{width:12px;height:12px}
.var{display:flex;gap:4px;margin-top:6px}.var button{flex:1;padding:8px 0;border-radius:6px;font:700 13px var(--tc);background:#0a1c15;border:1px solid #21402f;color:var(--mute)}
.var button.on{background:#1f6e53;border-color:var(--teal);color:var(--ink)}
/* 出貨 */
.cost{display:flex;align-items:baseline;gap:10px}.cost b{font:800 34px var(--game);font-variant-numeric:tabular-nums}.cost small{font:13px var(--tc);color:var(--mute)}
.costBreak{font:600 12px var(--mono);color:var(--mute);margin-top:-4px}
.shipTimer{font:900 28px var(--game);color:var(--gold);text-align:center;letter-spacing:2px;font-variant-numeric:tabular-nums}
.shipTimer.low{color:var(--red);animation:tpulse .6s infinite}
@keyframes tpulse{0%,100%{opacity:1}50%{opacity:.4}}
.why{font:13px/1.5 var(--tc);color:#ff9a90;min-height:20px}.why.ok{color:var(--green)}
.shipbtn{height:74px;font-size:26px;letter-spacing:2px;width:100%}
.hint{font:12px/1.5 var(--tc);color:var(--mute)}
/* 彈窗 */
.modal{position:fixed;inset:0;z-index:40;display:none;place-items:center;padding:20px;background:rgba(2,8,6,.75);backdrop-filter:blur(3px)}
.modal.on{display:grid}
.card{width:min(820px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:24px 26px;border-radius:20px}
.card h2{margin:4px 0 10px;font:900 56px/1.1 var(--tc)}
.newmech{display:flex;gap:14px;align-items:center;padding:14px 16px;margin:10px 0;border-radius:14px;background:linear-gradient(90deg,rgba(255,198,90,.16),rgba(255,198,90,.03));border:1.5px solid rgba(255,198,90,.6);box-shadow:0 0 22px rgba(255,198,90,.12)}
.newmech .nmic{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:rgba(255,198,90,.16);border:1px solid rgba(255,198,90,.55)}
.newmech b{display:block;font:800 16px var(--tc);color:var(--gold)}.newmech span{font:13.5px/1.6 var(--tc);color:#e1ebe5}
.row{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
/* 十年結算 */
.years{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin:18px 0 8px}
.yr{position:relative;height:96px;border-radius:12px;background:#0a1912;border:1.5px solid #21402f;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:8px;font:800 12px var(--game);color:var(--mute);transition:all .25s}
.yr.lit{border-color:var(--green);color:var(--green);background:#0f2a1f}
.yr.hit{border-color:var(--red);color:#fff;background:linear-gradient(180deg,#5a1612,#2a0b09);box-shadow:0 0 20px rgba(255,79,69,.5);animation:shake .35s}
.yr .ev{position:absolute;top:8px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.evlog{min-height:52px;font:14px/1.6 var(--tc)}
.evlog div{animation:pop .3s}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.result{display:none}.result.on{display:block;animation:pop .35s}
.bigscore{display:flex;align-items:center;gap:20px;margin:6px 0 14px}
.bigscore b{font:900 84px/1 var(--game);background:linear-gradient(180deg,#fff6d2,#ffc65a 55%,#d1840f);-webkit-background-clip:text;background-clip:text;color:transparent}
.bigscore .stars .star{width:44px;height:44px;margin-right:4px;transform:scale(.3);opacity:0;transition:all .35s cubic-bezier(.2,1.6,.4,1)}
.bigscore .stars .star.show{transform:scale(1);opacity:1}
.cmp{width:100%;border-collapse:collapse;font:13.5px/1.45 var(--tc)}
.cmp th{font:700 12px var(--tc);color:var(--mute);text-align:left;padding:6px 8px;border-bottom:1px solid #21402f}
.cmp td{padding:7px 8px;border-bottom:1px solid #16301f;vertical-align:top}
.cmp .o{color:var(--amber)}.cmp .u{color:#ff8a80}.cmp .r{color:var(--green)}
.cmp td.w{color:#b9cbc0;font-size:12.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:60;padding:10px 18px;border-radius:12px;background:#1d0f0d;border:1px solid var(--red);font:700 14px var(--tc);transition:all .25s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.floatcoin{position:fixed;z-index:70;font:900 20px var(--game);color:var(--gold);pointer-events:none;animation:fly .7s forwards;text-shadow:0 2px 0 #000}
@keyframes fly{to{transform:translateY(-50px);opacity:0}}
.mark{text-align:center;font:11px/1.6 var(--tc);color:#557264;margin-top:16px}
/* ---------- 窄螢幕 ---------- */
@media (max-width:1180px){
 .ffr{grid-template-columns:repeat(3,minmax(0,1fr))}
 .zones{grid-template-columns:repeat(2,1fr)}
 .topRow{grid-template-columns:1fr 1fr}
 .shipbox{grid-column:1/-1}
}
@media (max-width:720px){
 .shelf{grid-template-columns:1fr}
 .wrap{padding:10px 12px 20px}
 .ffr{grid-template-columns:repeat(2,minmax(0,1fr))}
 .zones{grid-template-columns:1fr}
 /* 手機：放棄單頁不捲動，改成可以正常上下滑動的版面，不然主要操作區會被壓到看不清楚 */
 #play{height:auto;overflow:visible}
 #play .wrap{height:auto;display:block;overflow:visible}
 .topRow{grid-template-columns:1fr;grid-template-rows:none;flex:none;display:flex;flex-direction:column}
 .stage3d,.scn,.shipbox{max-height:none;overflow:visible}
 .stage3d{height:220px}
 .shipbox{gap:8px}
 .pager{flex:none}
 .pages{flex:none}
 .page{height:auto;overflow:visible}
 .years{grid-template-columns:repeat(5,1fr)}
 .ttl b{font-size:34px}.dots{display:none}
 .mhd h2{font-size:48px}
 .zone h3{font-size:30px}
 .lvl b{font-size:24px}
 .card{padding:18px}
 .bigscore b{font-size:64px}
 .cmp,.cmp tbody,.cmp tr,.cmp td{display:block}
 .cmp tr:first-child{display:none}
 .cmp tr{padding:8px 0;border-bottom:1px solid #16301f}
 .cmp td{border-bottom:none;padding:2px 0}
 .cmp td:first-child{font:800 13px var(--tc)}
 .cmp td[data-l]::before{content:attr(data-l) "：";color:var(--mute);font-size:11px;margin-right:4px}
 .cmp .w{display:block;font-size:12px;margin-top:2px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

    { id: 1, dom: "retail", icon: "kiosk", maxLen: 150, req: { com: 2, lan: 1, can: 0, lte: 0 }, cards: [], vol: 1500,
      need: [0, 0, 0, 0, 0, 0], unlock: ["board", "usb"] },
    { id: 2, dom: "retail", icon: "vending", maxLen: 200, req: { com: 4, lan: 1, can: 0, lte: 0 }, cards: ["ai"], vol: 3000,
      need: [0, 0, 0, 0, 0, 0], unlock: ["pcie"] },
    { id: 3, dom: "factory", icon: "gauge", maxLen: 260, req: { com: 2, lan: 2, can: 0, lte: 0 }, cards: ["daq", "daq"], vol: 300,
      need: [0, 0, 0, 2, 1, 0], unlock: ["store", "power"] },
    { id: 4, dom: "factory", icon: "agv", maxLen: 150, req: { com: 2, lan: 2, can: 1, lte: 0 }, cards: [], vol: 800,
      need: [1, 1, 0, 1, 1, 0], unlock: ["temp", "m2"] },
    { id: 5, dom: "medical", icon: "bed", maxLen: 150, req: { com: 2, lan: 2, can: 0, lte: 0 }, cards: [], vol: 600,
      need: [0, 1, 2, 1, 1, 1], unlock: ["prot", "cert"] },
    { id: 6, dom: "medical", icon: "scan", maxLen: 320, req: { com: 1, lan: 2, can: 0, lte: 0 }, cards: ["gpu", "cap"], vol: 200,
      need: [0, 0, 0, 2, 1, 1], unlock: ["supply"] },
    { id: 7, dom: "energy", icon: "charger", maxLen: 150, req: { com: 4, lan: 1, can: 1, lte: 1 }, cards: [], vol: 10000,
      need: [2, 1, 2, 1, 1, 0], unlock: ["custom"] },
    { id: 8, dom: "energy", icon: "grid", maxLen: 320, req: { com: 4, lan: 4, can: 0, lte: 0 }, cards: [], vol: 150,
      need: [2, 2, 2, 1, 2, 1], unlock: [] },
    { id: 9, dom: "transport", icon: "ship", maxLen: 200, req: { com: 4, lan: 2, can: 0, lte: 0 }, cards: [], vol: 120,
      need: [1, 1, 2, 1, 1, 1], unlock: [] },
    { id: 10, dom: "transport", icon: "train", maxLen: 150, req: { com: 2, lan: 2, can: 1, lte: 1 }, cards: [], vol: 400,
      need: [2, 2, 1, 1, 2, 1], unlock: [], boss: true },
  ];
  const CARD_SLOT = { ai: "x4", daq: "x4", gpu: "x16", cap: "x4" };

  // 到第 n 關為止解鎖的機制
  function unlockedAt(n) {
    const s = new Set();
    LEVELS.filter((l) => l.id <= n).forEach((l) => l.unlock.forEach((u) => s.add(u)));
    return s;
  }
  const TIER_UNLOCK = { temp: "temp", power: "power", prot: "prot", store: "store", supply: "supply", cert: "cert" };

  // 把必插卡與擴充卡放進槽：x16 卡只能進 x16；x4 卡進 x4 或 x16。回傳是否放得下。
  function fits(board, lvCards, nPcie) {
    let x16 = board.x16, x4 = board.x4;
    for (const c of lvCards) {
      if (CARD_SLOT[c] === "x16") { if (x16 > 0) x16--; else return false; }
    }
    for (const c of lvCards) {
      if (CARD_SLOT[c] === "x4") { if (x4 > 0) x4--; else if (x16 > 0) x16--; else return false; }
    }
    return nPcie <= x4 + x16;
  }

  // 評估一組選擇。build = { board, add:{id:count}, t:[6 級] }
  function evaluate(lv, build) {
    const b = BOARDS.find((x) => x.id === build.board);
    const add = build.add || {};
    const out = { ok: true, reasons: [], have: { com: 0, lan: 0, can: 0, lte: 0 }, buy: 0, loss: 0, lossItems: [], ports: 0, dongles: 0 };
    if (!b) { out.ok = false; out.reasons.push("noBoard"); return out; }
    if (b.len > lv.maxLen) { out.ok = false; out.reasons.push("tooBig"); }
    let nPcie = 0, nM2 = 0;
    for (const id of ADDON_ORDER) {
      const n = add[id] || 0; if (!n) continue;
      const a = ADDONS[id];
      if (a.kind === "pcie") nPcie += n;
      if (a.kind === "m2") nM2 += n;
      for (const k in a.give) out.have[k] += a.give[k] * n;
    }
    if (b.custom) {
      if (lv.cards.length) { out.ok = false; out.reasons.push("noSlot"); }
      if (nPcie || nM2) { out.ok = false; out.reasons.push("customNoAddon"); }
      for (const k in lv.req) out.have[k] = Math.max(out.have[k], lv.req[k]);  // 客製底板：介面剛好做進去
    } else {
      out.have.com += b.com; out.have.lan += b.lan;
      if (!fits(b, lv.cards, nPcie)) { out.ok = false; out.reasons.push("noSlot"); }
      if (nM2 > b.m2) { out.ok = false; out.reasons.push("noM2"); }
    }
    for (const k in lv.req) if (out.have[k] < lv.req[k]) { out.ok = false; out.reasons.push("need_" + k); }

    // 整組擴充品完全沒用到（去掉後介面仍滿足需求）：原價加罰一次，當成浪費
    let wasteAddon = 0;
    for (const id of ADDON_ORDER) {
      const n = add[id] || 0; if (!n) continue;
      const a = ADDONS[id]; if (a.kind === "usb") continue;
      for (const k in a.give) { if (out.have[k] - a.give[k] * n >= (lv.req[k] || 0)) wasteAddon += a.price * n; }
    }

    const t = build.t;
    const base = b.custom ? b.price + COME_NRE / lv.vol : b.price;
    const hw = base + wasteAddon + ADDON_ORDER.filter((i) => ADDONS[i].kind !== "usb").reduce((s, i) => s + (add[i] || 0) * ADDONS[i].price, 0);
    out.hw = hw;
    out.buy = hw * TIERS[0].cost[t[0]];
    const usb = ADDON_ORDER.filter((i) => ADDONS[i].kind === "usb");
    out.dongles = usb.reduce((s, i) => s + (add[i] || 0), 0);
    out.buy += usb.reduce((s, i) => s + (add[i] || 0) * ADDONS[i].price, 0);
    // 實裝且可防護的埠：板載＋卡上的 COM、CAN 模組；轉接器不能防護
    out.ports = b.custom ? lv.req.com + lv.req.can : b.com + (add.com4 || 0) * 4 + (add.can || 0);
    for (const i of usb) if (add[i]) { out.loss += add[i] * ADDONS[i].loss; out.lossItems.push({ id: i, n: add[i], v: add[i] * ADDONS[i].loss }); }
    TIERS.forEach((T, i) => {
      if (i === 0) return;
      out.buy += T.perPort ? T.cost[t[i]] * out.ports : T.cost[t[i]];
    });
    TIERS.forEach((T, i) => {
      const gap = lv.need[i] - t[i];
      if (gap > 0) {
        const mult = T.perPort ? Math.max(1, out.ports + out.dongles) : 1;
        const v = T.under * (gap === 1 ? 1 : 1.5) * mult;
        out.loss += v; out.lossItems.push({ id: T.id, gap, v });
      }
      if (T.perPort && lv.need[i] > 0 && out.dongles) {          // 轉接器上的埠沒有防護
        const v = T.under * (lv.need[i] === 1 ? 1 : 1.5) * out.dongles;
        out.loss += v; out.lossItems.push({ id: "prot_usb", v });
      }
    });
    out.total = out.buy + out.loss;
    return out;
  }

  // 列舉所有可出貨組合（鎖住的分級固定在 need）
  function enumerate(lv) {
    const un = unlockedAt(lv.id);
    const tierChoices = TIERS.map((T, i) => (un.has(TIER_UNLOCK[T.id]) ? [...Array(T.cost.length).keys()] : [lv.need[i]]));
    const rows = [];
    const addonRanges = {
      com4: un.has("pcie") ? [0, 1, 2] : [0], lan2: un.has("pcie") ? [0, 1, 2] : [0],
      can: un.has("m2") ? [0, 1] : [0], lte: un.has("m2") ? [0, 1] : [0],
      ucom: [0, 1, 2, 3, 4], ucan: un.has("m2") ? [0, 1] : [0], ulte: un.has("m2") ? [0, 1] : [0],
    };
    const boards = BOARDS.filter((b) => !b.custom || un.has("custom"));
    const combos = cart(ADDON_ORDER.map((k) => addonRanges[k]));
    const tcombos = cart(tierChoices);
    for (const b of boards) for (const c of combos) {
      const add = {}; ADDON_ORDER.forEach((k, i) => { if (c[i]) add[k] = c[i]; });
      const probe = evaluate(lv, { board: b.id, add, t: lv.need });
      if (!probe.ok) continue;
      for (const t of tcombos) {
        const e = evaluate(lv, { board: b.id, add, t });
        rows.push({ board: b.id, add, t, e });
      }
    }
    rows.sort((a, b) => a.e.total - b.e.total);
    return rows;
  }
  function cart(arrs) { return arrs.reduce((acc, a) => acc.flatMap((x) => a.map((y) => [...x, y])), [[]]); }

  // 最佳解：建置時預先算好嵌入（G.SQ_BEST），瀏覽器不必現場窮舉
  const _bestCache = {};
  function best(lv) {
    if (_bestCache[lv.id]) return _bestCache[lv.id];
    const pre = G.SQ_BEST && G.SQ_BEST[lv.id];
    const r = pre ? { board: pre.board, add: pre.add, t: pre.t, e: evaluate(lv, pre) } : enumerate(lv)[0];
    return (_bestCache[lv.id] = r);
  }

  // 計分：100 × 剛好 ÷（剛好 ＋ 4 × 多付 ＋ 損失）
  function score(lv, build) {
    const e = evaluate(lv, build);
    const B = best(lv);
    if (!e.ok) return { score: 0, e, waste: 0, items: [], best: B };
    const items = [];
    const hwOver = Math.max(0, e.hw - B.e.hw) * TIERS[0].cost[build.t[0]];
    if (hwOver > 0.5) items.push({ id: "hw", kind: "over", v: hwOver });
    let tierOver = 0;
    TIERS.forEach((T, i) => {
      const k = build.t[i], n = lv.need[i];
      if (k > n) {
        const v = i === 0 ? B.e.hw * (T.cost[k] - T.cost[n]) : (T.cost[k] - T.cost[n]) * (T.perPort ? e.ports : 1);
        if (v > 0) { tierOver += v; items.push({ id: T.id, kind: "over", v }); }
      }
    });
    e.lossItems.forEach((li) => items.push({ id: li.id, kind: "under", v: li.v }));
    const waste = Math.max(hwOver + tierOver, e.buy - B.e.buy);
    const s = Math.round((100 * B.e.total) / (B.e.total + OVER_K * waste + e.loss));
    return { score: Math.min(100, s), e, waste, items, best: B };
  }
  function stars(s) { return s >= 90 ? 3 : s >= 75 ? 2 : s >= 50 ? 1 : 0; }

  G.SQ = { BOARDS, FORMS, ADDONS, ADDON_ORDER, TIERS, LEVELS, CARD_SLOT, COME_NRE, unlockedAt, evaluate, enumerate, best, score, stars };
})(typeof window !== "undefined" ? window : globalThis);

function renderScene() {
  const box = $("#stage3d");

  } else {

    for (let i = 0; i < (B.add.lan2 || 0); i++) cardsIn.push({ c: "lan2", cls: "mine" });
    const placed = slots.map(() => null), used = new Set();
    cardsIn.forEach((ci) => { let k = slots.findIndex((sl, j) => !used.has(j) && (ci.need === "x16" ? sl === "x16" : sl === "x4")); if (k < 0) k = slots.findIndex((sl, j) => !used.has(j)); if (k >= 0) { used.add(k); placed[k] = ci; } });
    const sy0 = bh * .66, step = Math.min(22, (bh * .3) / Math.max(1, slots.length));

   <div class="enc ${big ? "bad" : ""}" style="left:0;top:0;width:${el}px;height:${el}px"><span>${T("req.len", {v: CUR.maxLen})}</span></div>
   <div class="pcb ${b.custom ? "come" : ""}" style="left:${big ? 0 : (el - bw) / 2}px;top:${big ? 0 : (el - bh) / 2}px;width:${bw}px;height:${bh}px">${inner}</div></div>`;

/* ---------- 出貨與十年結算 ---------- */
function ship(force) {
  if ($("#mSim").classList.contains("on")) return;
  const r = SQ.score(CUR, B); if (!r.e.ok && !force) return;
  stopTimer();
  beep("ship");
  const prev = PROG[CUR.id]; if (prev == null || r.score > prev) { PROG[CUR.id] = r.score; store.set("prog", PROG); }
  const events = r.items.filter((x) => x.kind === "under").map((x) => ({ id: x.id, y: TXT[LANG].evYear[x.id] || 3, v: x.v }));
  const card = $("#simCard");
  card.innerHTML = `<div class="k">${T("lv", {n: CUR.id})} · ${L(CUR.id).n}</div><h2>${T("simTitle")}</h2>
   <div class="years">${[...Array(10)].map((_, i) => `<div class="yr" id="y${i + 1}"><span class="ev"></span>${T("year", {n: i + 1})}</div>`).join("")}</div>
   <div class="evlog" id="evlog"></div><div class="row" id="skipRow"><button class="btn ghost" id="bSkip">${T("skip")}</button></div><div class="result" id="res"></div>`;
  $("#mSim").classList.add("on");
  $("#bSkip").focus();
  let y = 0, done = false;
  const step = () => {
    if (done) return; y++;
    const evs = events.filter((x) => x.y === y), cell = $("#y" + y);
    if (evs.length) { cell.classList.add("hit"); cell.querySelector(".ev").innerHTML = ic("bolt", 26); beep("hit");
      evs.forEach((x) => $("#evlog").insertAdjacentHTML("beforeend", `<div><b style="color:#ff8a80">${T("year", {n: y})}</b>　${TXT[LANG].ev[x.id]}　<b style="color:#ff8a80">−${fmt(x.v)}</b></div>`)); }
    else { cell.classList.add("lit"); cell.querySelector(".ev").innerHTML = ic("badge", 22); }
    if (y < 10) step._t = setTimeout(step, evs.length ? 650 : 260); else finish();
  };
  const finish = () => { if (done) return; done = true; clearTimeout(step._t);
    for (let i = 1; i <= 10; i++) { const c = $("#y" + i); if (!c.classList.contains("hit") && !c.classList.contains("lit")) { const hit = events.some((x) => x.y === i); c.classList.add(hit ? "hit" : "lit"); c.querySelector(".ev").innerHTML = ic(hit ? "bolt" : "badge", hit ? 26 : 22); } }
    $("#evlog").innerHTML = events.length ? events.map((x) => `<div><b style="color:#ff8a80">${T("year", {n: x.y})}</b>　${TXT[LANG].ev[x.id]}　<b style="color:#ff8a80">−${fmt(x.v)}</b></div>`).join("") : `<div style="color:var(--green)">${T("calm")}</div>`;
    $("#skipRow").remove(); showResult(r); };
  $("#bSkip").onclick = finish;
  step._t = setTimeout(step, 400);
}
function showResult(r) {
  const res = $("#res"), st = SQ.stars(r.score), best = r.best, t = L(CUR.id);
  const nm = (bid) => { const b = SQ.BOARDS.find((x) => x.id === bid); const vs = SQ.BOARDS.filter((x) => x.ff === b.ff); return T("ff." + b.ff) + (vs.length > 1 ? " " + (b.ff === "sbc" ? TXT[LANG].varSbc : TXT[LANG].var)[b.v] : "") + ` (${b.model})`; };
  const addStr = (a) => Object.entries(a).map(([k, v]) => `${TXT[LANG].addon[k]}×${v}`).join("、");
  const pick = nm(B.board) + (addStr(B.add) ? " ＋ " + addStr(B.add) : ""), right = nm(best.board) + (addStr(best.add) ? " ＋ " + addStr(best.add) : "");
  const hwItem = r.items.filter((x) => ["hw","ucom","ucan","ulte","prot_usb"].includes(x.id)).reduce((s, x) => s + (x.kind === "over" ? x.v : -x.v), 0);
  let rows = `<tr><td>${T("boardRow")}</td><td data-l="${T("yourPick")}">${pick}</td><td class="r" data-l="${T("right")}">${right}</td><td class="${hwItem > 0 ? "o" : hwItem < 0 ? "u" : "r"}" data-l="${T("diff")}">${hwItem > 0 ? T("over", {v: fmt(hwItem)}) : hwItem < 0 ? T("under", {v: fmt(-hwItem)}) : (B.board === best.board && addStr(B.add) === addStr(best.add) ? T("same") : "—")}</td><td class="w">${t.w.board}</td></tr>`;
  SQ.TIERS.forEach((Tr, i) => {
    const o = TXT[LANG].tierOpt[Tr.id], k = B.t[i], n = CUR.need[i], it = r.items.find((x) => x.id === Tr.id);
    const cls = k > n ? "o" : k < n ? "u" : "r", d = it ? (it.kind === "over" ? T("over", {v: fmt(it.v)}) : T("under", {v: fmt(it.v)})) : T("same");
    rows += `<tr><td>${T("tier." + Tr.id)}${isUnlocked(Tr.id) ? "" : " " + ic("lock", 12).replace('class="ic"', 'class="ic" style="display:inline"')}</td><td class="${cls}" data-l="${T("yourPick")}">${o[k]}</td><td class="r" data-l="${T("right")}">${o[n]}</td><td class="${cls}" data-l="${T("diff")}">${d}</td><td class="w">${t.w[Tr.id]}</td></tr>`;
  });
  const last = CUR.id === 10, nextOpen = !last;
  res.innerHTML = `<div class="bigscore"><b id="scNum">0</b><div><div class="stars">${[0,1,2].map((i) => `<span class="star ${i < st ? "on" : ""}"></span>`).join("")}</div>
    <div style="font:800 18px var(--tc);margin-top:6px">${TXT[LANG].stars[st]}</div></div></div>
   <table class="cmp"><tr><th></th><th>${T("yourPick")}</th><th>${T("right")}</th><th>${T("diff")}</th><th class="w">${T("reason2")}</th></tr>${rows}</table>
   ${last && st >= 1 ? `<div class="newmech" style="margin-top:14px">${ic("badge", 34)}<div><b>${T("allDone")}</b><span>${T("allDoneSub", {s: SQ.LEVELS.reduce((s, l) => s + starsOf(l.id), 0)})}</span></div></div>` : ""}
   <div class="row"><button class="btn ghost" id="bMap2">${T("toMap")}</button><button class="btn ghost" id="bRetry">${T("retry")}</button>${nextOpen ? `<button class="btn" id="bNext">${T("next")}</button>` : ""}</div>`;
  res.classList.add("on");
  let v = 0; const tgt = r.score, num = $("#scNum"); const tick = () => { v = Math.min(tgt, v + Math.max(1, Math.round(tgt / 25))); num.textContent = v; if (v < tgt) setTimeout(tick, 24); else $$("#res .stars .star").forEach((s, i) => setTimeout(() => { s.classList.add("show"); if (s.classList.contains("on")) beep("star"); }, 180 * i)); };
  tick();
  $("#bRetry").onclick = () => { beep("click"); $("#mSim").classList.remove("on"); if (FORMAL) { TIME_LEFT = TIME_BUDGET[CUR.id] || 0; startTimer(); } };
  $("#bMap2").onclick = () => { beep("click"); $("#mSim").classList.remove("on"); stopBgm(); show("map"); renderMap(); };
  if (nextOpen) $("#bNext").onclick = () => { beep("click"); $("#mSim").classList.remove("on"); startLevel(CUR.id + 1); };
  renderHud();
}

/* ---------- 綁定 ---------- */
$("#bStart").onclick = () => { beep("ok"); $("#bgmTitle").pause(); show("map"); renderMap(); };
$("#bMapBack").onclick = () => { beep("click"); stopBgm(); show("title"); playTitleBgm(); };
$("#bToMap").onclick = () => { beep("click"); stopTimer(); stopBgm(); show("map"); renderMap(); };
$("#bBrief").onclick = () => { beep("click"); openBrief(); };
$("#bShip").onclick = ship;
$("#bPagePrev").onclick = () => { if (PAGE > 0) { PAGE--; beep("click"); renderPager(); } };
$("#bPageNext").onclick = () => { if (PAGE < PAGE_COUNT - 1) { PAGE++; beep("click"); renderPager(); } };
$$(".bLang").forEach((x) => x.onclick = () => { LANG = LANG === "zh" ? "en" : "zh"; store.set("lang", LANG); beep("click"); i18n(); if ($("#mBrief").classList.contains("on")) openBrief(); });
$$(".bSnd").forEach((x) => x.onclick = () => { MUTE = !MUTE; store.set("mute", MUTE); i18n(); beep("click");
  if (MUTE) stopBgm();
  else if ($("#play").classList.contains("on")) playBgm();
  else if ($("#title").classList.contains("on")) playTitleBgm(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { $("#mBrief").classList.remove("on"); } });
// 瀏覽器會擋在使用者互動前自動播放音訊，第一次互動時才真的播放標題配樂
["pointerdown", "keydown"].forEach((ev) => document.addEventListener(ev, () => { if ($("#title").classList.contains("on")) playTitleBgm(); }, { once: true }));
let _rz; window.addEventListener("resize", () => { clearTimeout(_rz); _rz = setTimeout(() => { if ($("#play").classList.contains("on")) renderScene(); }, 120); });
i18n();
// 測試用掛鉤（不影響遊玩）
window.__sq = { startLevel, get B() { return B; }, set B(v) { B = v; }, renderAll, ship, show, renderMap, prog: () => PROG };
</script>
